server:
  port: 18086

spring:
  application:
    name: ypbin-access
  cloud:
    nacos:
      # 容器/非容器都用同一占位符：compose 注入 NACOS_ADDR 时才真的生效
      server-addr: ${NACOS_ADDR:localhost:8848}
  config:
    import:
      - optional:nacos:ypbin-access.yaml
  # access 不连库：显式排除数据源自动配置（避免被共享配置里的 datasource.url 拖起来又没有驱动）
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

ypbin:
  # TCP 透传入站载荷格式：key-value = SDK 按点位 selector（raw_address）从 KEY=VALUE 帧取值；
  # 宿主不再做帧解析。⚠️ 不配会退回 SDK 默认 binary（整帧 byte[]）⇒ 读数全丢（升级顺序见 DEPLOY 文档）。
  iot:
    protocol:
      tcp:
        payload-format: key-value
  # 出站内部凭证（access → iot 的 /internal/**）**不在这里配**：starter 4.0.0 起由
  # ypbin.cloud.feign.internal-token 经 FeignHeaderInterceptor 全局携带，配置位置是 Nacos
  # Data ID `ypbin-access.yaml`（见 deploy/nacos/ypbin-access.yaml）。
  # ⚠️ 旧键（ypbin 命名空间下的 internal.token）已废弃（无任何消费方），写在这里不会生效——漏配正确键的后果是
  # iot 的 /internal/** 守卫 fail-closed 全拒（租约与读数上报全挂），而症状极易与「键写错地方」混淆。
  # 门禁：tools/check-deprecated-config-keys.sh 会拦住这类已登记废弃键。
