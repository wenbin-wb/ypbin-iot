version: 2
updates:
  # Maven 依赖：每周检查，安全更新优先合并
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # 同族依赖合并为一个 PR，减少噪音
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
      test:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
      # 静态分析工具链：Error Prone 与 NullAway 存在版本耦合（新版 EP 会改变插件调用方式），
      # 必须同批升级、同批验证，避免只升其一导致「插件起不来/分析空转」
      analysis:
        patterns:
          - "com.google.errorprone*"
          - "com.uber.nullaway*"
          - "org.jspecify*"
    # ArchUnit 版本钉死跟 starter 走（见 ypbin-architecture-tests/pom.xml 注释），且该 pom
    # 属上游模块、Sync Whitelist 禁止修改 —— dependabot 提了也合不了（如 #172），直接忽略，
    # starter 侧升级时手动同步。
    ignore:
      - dependency-name: "com.tngtech.archunit*"
    labels:
      - dependencies

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
