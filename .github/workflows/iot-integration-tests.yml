name: IoT Integration Tests

# 为什么单独一个工作流：本仓的 ci.yml 是 **DB-free** 的 `mvn -B clean verify`，无法承载需要真实
# 中间件的集成测试；而设计 §15.1 门禁把「集成测试（-Pit）」列为必过项，§10/§14 的越权用例与
# M-2 的「真库并发用例」都必须跑在真库上。
#
# 本工作流用 runner 自带 Docker + Testcontainers 起 MySQL（不依赖任何外部实例、不连生产库），
# 跑 §5 之外第一优先的那条：**跨租户隔离**（断言口径见设计 D0.5）。
#
# ⚠️ 关键防假绿：starter 的容器化 IT 用 @EnabledIfMySqlAvailable，MySQL 不可用时**静默跳过**。
# 跳过 == 没测，所以下面有一步专门断言「报告存在 + 执行条数 ≥1 + 无跳过」，否则整条工作流转红。
on:
  pull_request:
    branches: [main]
  # 2026-10-13 加 main：**合并之后**也要有真库回归。
  # 为什么必须加：两个 PR 各自绿、叠加后互相影响（squash 合并出的 main 状态与任一 PR 分支都不同）时，
  # 以前只有单测/架构门禁在 main 上跑，**真库层面的叠加回归没人拦**（审计 issue #235）。
  # 代价如实登记：每次 main 合并多跑一次 Testcontainers 作业（分钟级）。
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: 集成测试（-Pit，真 MySQL 容器）
    runs-on: ubuntu-latest
    steps:
      - name: 检出 ypbin-iot 代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 🔴 2026-11-21 加：清掉缓存里的「外来仓库标记」，否则本地 install starter 必然失败（假红）。
      #
      # 根因（一手日志，run #828）：`setup-java` 的 `cache: maven` 会把 `~/.m2/repository` 整个缓存下来，
      # 其中每个制品目录都有 Maven Resolver 的 `_remote.repositories` 标记（记录该制品从哪个 repo id 下载）。
      # 本机/开发机的 `settings.xml` 配了 `aliyun` 镜像与 `central-only` 仓库，于是标记写成
      #   spring-boot-dependencies-4.1.2.pom>aliyun= / >central-only=
      # 而 runner 上只有 `central` 这个 repo id ⇒ Maven 判定这些制品「present, but unavailable」，
      # 且**不会重新下载**（失败被缓存），直接报：
      #   Non-resolvable import POM: org.springframework.boot:spring-boot-dependencies:pom:4.1.2
      #   (present, but unavailable) ... was not found in ... during a previous attempt
      # 注意：这些版本在 Central **真实存在**（2026-11-21 实测 6 个 BOM 全部 HTTP 200），
      # 所以这是**缓存污染造成的假红**，不是依赖问题。
      #
      # 修法：删掉所有 `_remote.repositories` 标记 ⇒ Resolver 视这些制品为「本地已装、来源未知」，
      # 照常使用，不再做 repo id 校验。代价一次几秒，远小于「随机红被当噪音忽略」的成本。
      - name: 清理 Maven 缓存里的外来仓库标记（防「present, but unavailable」假红）
        run: |
          set -euo pipefail
          n=$(find "$HOME/.m2/repository" -name '_remote.repositories' -type f 2>/dev/null | wc -l)
          echo "命中 _remote.repositories 标记文件：$n 个"
          find "$HOME/.m2/repository" -name '_remote.repositories' -type f -delete 2>/dev/null || true
          # 同时清掉「解析失败」缓存：*.lastUpdated 会让 Maven 在 update interval 内不再重试
          m=$(find "$HOME/.m2/repository" -name '*.lastUpdated' -type f 2>/dev/null | wc -l)
          echo "命中 *.lastUpdated 失败缓存：$m 个"
          find "$HOME/.m2/repository" -name '*.lastUpdated' -type f -delete 2>/dev/null || true
          echo "清理完成"

      - name: 读取本仓要求的 starter 版本
        id: starter_version
        run: |
          set -euo pipefail
          version="$(grep -oP '(?<=<ypbin-starter.version>)[^<]+' pom.xml)"
          echo "本仓依赖 starter ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # 必须按 **tag** 取源而不能用 master：master 是下一个 SNAPSHOT（如 3.4.1-SNAPSHOT），
      # 而集成测试要用的 ypbin-starter-test 模块**未发布到远程仓库**（Central 只有 pom、无 jar），
      # 只能从与 ypbin-starter.version 同版本的 tag 源码本地安装获得。
      - name: 检出 ypbin-starter（tag v${{ steps.starter_version.outputs.version }}）
        uses: actions/checkout@v7
        with:
          repository: wenbin-wb/ypbin-starter
          ref: v${{ steps.starter_version.outputs.version }}
          path: ypbin-starter

      - name: 本地安装 ypbin-starter（含未发布的 ypbin-starter-test）
        run: mvn -B clean install -DskipTests -Djacoco.skip=true
        working-directory: ypbin-starter

      - name: 执行集成测试（-Pit；Testcontainers 用 runner 自带 Docker）
        run: mvn -B -Pit -pl ypbin-service/ypbin-iot -am verify -Dsurefire.skip=true

      - name: 断言集成测试真的执行了（防 @EnabledIfMySqlAvailable 静默跳过造成假绿）
        run: |
          set -euo pipefail
          report="ypbin-service/ypbin-iot/target/failsafe-reports/cn.ypbin.admin.iot.it.IotTenantIsolationIT.txt"
          if [ ! -f "$report" ]; then
            echo "::error::未生成集成测试报告 $report ⇒ 集成测试没有执行（假绿）"
            exit 1
          fi
          echo "--- $report ---"
          cat "$report"
          if grep -Eq "Skipped: [1-9]" "$report"; then
            echo "::error::集成测试被跳过（MySQL 容器不可用）——跳过等于没测，不得以跳过收场"
            exit 1
          fi
          total="$(grep -oP 'Tests run: \K[0-9]+' "$report" | head -1)"
          if [ -z "$total" ] || [ "$total" -lt 1 ]; then
            echo "::error::集成测试执行条数为 0"
            exit 1
          fi
          echo "OK：集成测试执行 ${total} 条，无跳过"

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iot-failsafe-reports
          path: ypbin-service/ypbin-iot/target/failsafe-reports/
          if-no-files-found: warn
