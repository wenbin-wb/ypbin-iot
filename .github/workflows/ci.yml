name: CI

on:
  push:
    branches: [ main, boot, feature/miniapp-backend ]
  pull_request:
    branches: [ main, boot, feature/miniapp-backend ]

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出 ypbin-admin 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 校验 starter 依赖版本为最新 Release（防版本漂移）
        # ⚠️ 必须带认证头：GitHub REST API 的**未认证**额度是 60 次/小时/IP，
        #    而托管 runner 的出口 IP 是共享的 ⇒ 实测出现 `curl: (22) ... error: 403`，
        #    让本步**随机转红**（2026-10-13 main 与 PR 各出现一次）。随机红比没有门禁更坏
        #    （会让人习惯性忽略红），故用 `github.token` 认证（同仓库只读，额度 5000/小时）。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQ=$(grep -oP '(?<=<ypbin-starter.version>)[^<]+' pom.xml)
          LATEST=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/wenbin-wb/ypbin-starter/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "admin 依赖 starter ${REQ}，最新 Release v${LATEST}"
          [ "$REQ" = "$LATEST" ] || { echo "依赖版本落后，请升级至最新 Release"; exit 1; }

      - name: 检出 ypbin-starter（版本以 admin pom 的 ypbin-starter.version 为准）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 本地安装 ypbin-starter
        run: mvn -B clean install -DskipTests -Djacoco.skip=true
        working-directory: ypbin-starter

      - name: 编译、代码风格校验与测试
        run: mvn -B clean verify
