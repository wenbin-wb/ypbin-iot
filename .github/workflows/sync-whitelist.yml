name: Sync Whitelist

# 把「与 admin 基座的同步纪律」变成机器检查：
#   1) 改动的**既有 admin 文件**必须落在白名单内（新增文件不受限——IoT 业务一律加新文件/新模块）；
#      白名单当前 **46 个文件**（见 SYNC.md 第二节与 tools/sync-whitelist-regex.sh，三处必须一致）；
#   2) IoT 的 SQL 迁移脚本必须与全新安装脚本语句等价；
#   3) Nacos 身份模式配置键齐备（enabled=true ⇒ 必须配 trusted-source-token，否则 3.6.0 起启动失败）；
#   4) 配置里不得出现已登记**废弃**的键（#297：旧内部凭证键、以及 Sa-Token 的不存在命名空间 ——
#      「写了但不生效」会误导运维，且漏配正确键会让 /internal/** fail-closed 全拒）。
#      废弃键清单的**单一来源**是 tools/check-deprecated-config-keys.sh，勿在此重复列举。
# 注意：`git diff upstream/main --stat` 的字面数字包含**新增文件**，比白名单口径大得多；
#      本工作流检查的是「改动的既有文件」（--diff-filter=MDR），别把两者混为一谈。
# 为什么需要：纪律只写在 SYNC.md 里没有强制力——本仓刚建立时，依赖机器人（Dependabot）的 PR
# 就在改 admin 拥有的 ci.yml/codeql.yml，合进去就破坏了「只改白名单内的文件」的分歧面。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whitelist:
    runs-on: ubuntu-latest
    steps:
      - name: 检出（需要完整历史以计算与 upstream 的分歧）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 拉取 upstream（ypbin-admin）
        run: |
          git remote add upstream https://github.com/wenbin-wb/ypbin-admin.git
          git fetch --no-tags upstream main

      - name: 校验「改动的既有 admin 文件」都在白名单内
        run: |
          set -euo pipefail
          # 白名单**单一来源**：tools/sync-whitelist-regex.sh（内容与 SYNC.md 第二节必须一致）。
          # 抽出来的原因：upstream-sync.yml 的干跑合并也要用同一份清单；
          # 原来内联在此处 ⇒ 第二处使用就会产生第二份副本（本仓明确反对的漂移面）。
          ALLOWED="$(bash tools/sync-whitelist-regex.sh)"
          # 空正则会让下面的 grep -Eq "" 匹配一切 ⇒ 门禁假通过（2026-10-09 独立复核实测）。显式判死。
          if [ -z "$ALLOWED" ]; then
            echo "::error::同步白名单正则为空（tools/sync-whitelist-regex.sh 缺失或执行失败）——拒绝以空白名单放行"
            exit 1
          fi
          echo "当前白名单正则：$ALLOWED"
          # 判据（2026-10-18 更正）：白名单守的是**分歧面**，不是「相对 merge-base 动过哪些文件」。
          # 原判据 `git diff --diff-filter=MDR upstream/main...HEAD`（三点）会把「内容已回灌成与
          # upstream/main 逐字节一致」的文件也算成「改动了 admin 既有文件」——典型误报来源：本仓为修
          # 门禁违规把若干 admin 文件同步成上游版本（零分歧），三点 diff 仍命中它们，于是门禁转红而
          # 分歧面其实为零。现判据：取三点 diff 后**剔除与 upstream/main 逐字节一致的文件**，只对
          # 真实分歧做白名单校验（2026-10-18 实测：41 个候选中 16 个零分歧、25 个真实分歧全在白名单内）。
          candidates="$(git diff --name-only --diff-filter=MDR upstream/main...HEAD)"
          changed=""
          identical=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if git diff --quiet upstream/main HEAD -- "$file"; then
              identical=$((identical + 1))
              continue
            fi
            changed="${changed}${file}"$'\n'
          done <<< "$candidates"
          echo "相对 merge-base 动过的既有文件：$(printf '%s' "$candidates" | grep -c . || true) 个"
          echo "其中与 upstream/main 一致（零分歧，不计入白名单）：$identical 个"
          echo "真实改动的既有文件："
          echo "${changed:-（无）}"
          bad=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! printf '%s' "$file" | grep -Eq "$ALLOWED"; then
              echo "::error file=$file::$file 不在同步白名单内：改 admin 的文件会让 \`git merge upstream/main\` 越来越难。IoT 代码请放新模块/新文件；确需修改时先更新 SYNC.md 第二节的白名单与本工作流。"
              bad=1
            fi
          done <<< "$changed"
          [ "$bad" -eq 0 ] || exit 1
          echo "OK：真实改动的既有文件全部在白名单内"

      - name: IoT SQL 迁移脚本与全新安装脚本的语句等价
        run: bash tools/check-iot-sql-equivalence.sh

      - name: Nacos 身份模式配置键齐备（#6b：防「3.6.0 制品起不来」回归）
        run: |
          # 只依赖 PyYAML（出题范围小、易审计）；runner 自带 python3。
          python3 -m pip install --quiet 'pyyaml>=6,<7'
          bash tools/check-identity-config.sh

      - name: Nacos 导入前「live-only 键」检查工具自测（#304：防「整份覆盖静默丢键」）
        # 工具本身是纯标准库实现（不依赖 PyYAML：部署机不保证有，且这一步要能在裸机跑）。
        # 自测覆盖：嵌套键/注释/序列项/值内冒号/白名单/控制台 JSON 解包/本仓模板无块标量。
        run: python3 tools/nacos-live-only-diff.py --self-test

      - name: 配置里不得出现已登记的废弃键（#297：防「写了但不生效」）
        # 为什么放在本工作流而不是 ci.yml：ci.yml 是 **admin 拥有的既有文件**（SYNC.md 第二节
        # 明确「不改 admin 既有工作流的语义」，改它要进白名单并登记代价）。本工作流是 fork 自有的
        # 新建文件，挂在这里零同步冲突面——与本仓既有做法一致（dependency-vuln-gate 等同理）。
        run: |
          python3 -m pip install --quiet 'pyyaml>=6,<7'
          bash tools/check-deprecated-config-keys.sh
