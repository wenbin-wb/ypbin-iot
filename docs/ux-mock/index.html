<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!--
  ============================================================================
  ⚠️  这是「IoT 平台 UX/IA 方案」的**设计原型（Design Mock）**，不是生产代码。
  ----------------------------------------------------------------------------
  · 目的：让评审者能离线点开、直观体验 `docs/IOT-UX-PROPOSAL.md` 里的新导航、
    设备详情页、产品物模型编辑器与新手引导，用来对齐交互，**不参与任何构建**。
  · 数据：全部为**前端硬编码假数据**（本文件内 `DB` 常量），不请求任何接口。
  · 依赖：**零依赖、零外链**（无 CDN、无外部字体、无外部图片），双击即可离线打开。
  · 与真实前端的关系：真实实现落在 `ypbin-iot-ui`（vben5 + antd），本原型只表达
    信息架构与交互意图；组件外观与生产实现不保证一致。
  · 每个页面顶部有一条「设计标注」说明：用户从哪进入 / 点哪个按钮 / 下一步是什么。
  ============================================================================
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT 平台 UX 原型 · ypbin-iot（设计稿，非生产代码）</title>
<style>
  :root{
    --blue:#1677ff; --blue-1:#e6f4ff; --blue-2:#bae0ff;
    --green:#52c41a; --green-1:#f6ffed; --green-2:#b7eb8f;
    --red:#ff4d4f; --red-1:#fff2f0; --red-2:#ffccc7;
    --orange:#fa8c16; --orange-1:#fff7e6; --orange-2:#ffd591;
    --purple:#722ed1; --purple-1:#f9f0ff; --purple-2:#d3adf7;
    --text:#1f2329; --text-2:#5a6270; --text-3:#8f96a3;
    --bg:#f5f6f8; --line:#e5e7eb; --card:#fff;
    --sidebar:#1d2433; --sidebar-2:#252f42; --sidebar-text:#c3cad9;
    --radius:8px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text); background:var(--bg);
  }
  a{color:var(--blue);text-decoration:none}
  button{font:inherit;cursor:pointer}
  table{border-collapse:collapse;width:100%}
  code,.mono{font-family:var(--mono);font-size:12.5px}

  /* ---------- 骨架 ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{width:232px;flex:0 0 232px;background:var(--sidebar);color:var(--sidebar-text);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:16px 18px;border-bottom:1px solid #2b3purple;border-bottom:1px solid #2b3446}
  .brand b{color:#fff;font-size:15px;letter-spacing:.3px;display:block}
  .brand span{font-size:11px;color:#7d8798}
  .nav{padding:8px 0 24px}
  .nav-group{padding:14px 18px 6px;font-size:11px;letter-spacing:.8px;color:#6d7789;text-transform:uppercase}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 18px;color:var(--sidebar-text);font-size:13.5px;border-left:3px solid transparent}
  .nav a:hover{background:var(--sidebar-2);color:#fff}
  .nav a.on{background:var(--sidebar-2);color:#fff;border-left-color:var(--blue);font-weight:600}
  .nav .ico{width:16px;text-align:center;opacity:.9;font-size:13px}
  .nav .tag-new{margin-left:auto;font-size:10px;background:#2f4a7a;color:#9dc4ff;border-radius:3px;padding:0 5px}
  .nav .tag-reuse{margin-left:auto;font-size:10px;background:#2c4a34;color:#9be3b4;border-radius:3px;padding:0 5px}
  .nav .tag-gap{margin-left:auto;font-size:10px;background:#5a3630;color:#ffb3a7;border-radius:3px;padding:0 5px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 22px;
    display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .crumb{font-size:13px;color:var(--text-3)}
  .crumb b{color:var(--text);font-weight:600}
  .topbar .spacer{flex:1}
  .mock-flag{font-size:11px;background:var(--orange-1);color:#ad4e00;border:1px solid var(--orange-2);border-radius:99px;padding:2px 10px}
  .content{padding:18px 22px 60px;max-width:1500px}

  /* ---------- 设计标注条 ---------- */
  .anno{background:#fffbe6;border:1px dashed #ffd666;border-radius:var(--radius);
    padding:9px 13px;font-size:12.5px;color:#7a5c00;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
  .anno b{color:#ad6800}
  .anno .k{background:#fff1b8;border-radius:3px;padding:0 5px;font-family:var(--mono);font-size:11.5px}

  /* ---------- 通用卡片/排版 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card>h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card>h3 .sub{font-size:12px;color:var(--text-3);font-weight:400}
  h1.page{font-size:19px;margin:0 0 4px}
  .page-sub{color:var(--text-3);font-size:13px;margin-bottom:14px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .col{flex:1;min-width:260px}
  .muted{color:var(--text-3)}
  .small{font-size:12.5px}
  .mt{margin-top:12px}

  /* ---------- 按钮 ---------- */
  .btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 13px;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:#4096ff;border-color:#4096ff;color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--blue);padding:3px 6px}
  .btn.ghost:hover{background:var(--blue-1)}
  .btn.sm{padding:2px 9px;font-size:12px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btnbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .btnbar .spacer{flex:1}

  /* ---------- 标签 ---------- */
  .tag{display:inline-block;border-radius:4px;padding:0 7px;font-size:12px;line-height:19px;border:1px solid transparent;white-space:nowrap}
  .tag.blue{background:var(--blue-1);color:#0958d9;border-color:var(--blue-2)}
  .tag.green{background:var(--green-1);color:#389e0d;border-color:var(--green-2)}
  .tag.red{background:var(--red-1);color:#cf1322;border-color:var(--red-2)}
  .tag.orange{background:var(--orange-1);color:#d46b08;border-color:var(--orange-2)}
  .tag.purple{background:var(--purple-1);color:#531dab;border-color:var(--purple-2)}
  .tag.grey{background:#f2f3f5;color:#5a6270;border-color:#e5e7eb}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

  /* ---------- 表格 ---------- */
  .tbl{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .tbl table{font-size:13px}
  .tbl th{background:#fafbfc;text-align:left;font-weight:600;color:var(--text-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
  .tbl td{padding:9px 12px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover{background:#fafcff}
  .tbl .link{color:var(--blue);cursor:pointer}
  .tbl .link:hover{text-decoration:underline}
  .tbl .acts{white-space:nowrap}
  .empty{padding:34px;text-align:center;color:var(--text-3)}

  /* ---------- tab ---------- */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;font-size:13.5px;color:var(--text-2)}
  .tabs button:hover{color:var(--blue)}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

  /* ---------- 统计卡 ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
  .stat .lab{font-size:12.5px;color:var(--text-3)}
  .stat .val{font-size:24px;font-weight:600;margin-top:3px;letter-spacing:.5px}
  .stat .foot{font-size:11.5px;color:var(--text-3);margin-top:2px}

  /* ---------- 键值列表 ---------- */
  .kv{display:grid;grid-template-columns:132px 1fr;gap:7px 12px;font-size:13px}
  .kv dt{color:var(--text-3)}
  .kv dd{margin:0}

  /* ---------- 引导空态 ---------- */
  .onboard{max-width:940px;margin:0 auto}
  .steps{display:flex;gap:0;margin:8px 0 20px}
  .step{flex:1;text-align:center;position:relative;padding:0 8px}
  .step .num{width:38px;height:38px;line-height:36px;border-radius:50%;border:2px solid var(--line);
    background:#fff;margin:0 auto 8px;font-weight:700;color:var(--text-3)}
  .step.on .num{border-color:var(--blue);background:var(--blue);color:#fff}
  .step.done .num{border-color:var(--green);background:var(--green-1);color:var(--green)}
  .step .t{font-weight:600;font-size:13.5px}
  .step .d{font-size:12px;color:var(--text-3)}
  .step:not(:last-child):after{content:"";position:absolute;top:19px;right:-1px;width:calc(100% - 38px);
    left:calc(50% + 22px);height:2px;background:var(--line)}
  .step.done:not(:last-child):after{background:var(--green-2)}
  .panel{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:18px}

  /* ---------- 模板卡 ---------- */
  .tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
  .tpl{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:#fff;cursor:pointer}
  .tpl:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(22,119,255,.10)}
  .tpl h4{margin:0 0 4px;font-size:14px}
  .tpl .meta{font-size:12px;color:var(--text-3);margin-bottom:7px}
  .tpl .feats{font-size:12px;color:var(--text-2);font-family:var(--mono);line-height:1.7}

  /* ---------- 关系图（纯 CSS/HTML） ---------- */
  .map{overflow-x:auto;padding:6px 2px}
  .mapline{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:nowrap}
  .mbox{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:9px 12px;min-width:132px;text-align:center;font-size:13px}
  .mbox b{display:block;font-size:13px}
  .mbox span{font-size:11.5px;color:var(--text-3)}
  .mbox.p{border-color:var(--blue-2);background:var(--blue-1)}
  .mbox.s{border-color:var(--purple-2);background:var(--purple-1)}
  .mbox.f{border-color:var(--green-2);background:var(--green-1)}
  .mbox.d{border-color:var(--orange-2);background:var(--orange-1)}
  .arrow{color:var(--text-3);font-size:17px;flex:0 0 auto}
  .mapnote{font-size:12.5px;color:var(--text-3);margin:-4px 0 14px}

  /* ---------- 图 ---------- */
  .chart{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 6px 4px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--text-3);padding:0 12px 8px}

  /* ---------- 抽屉（原型内联展示，不做浮层） ---------- */
  .inline-drawer{border:1px solid var(--blue-2);background:var(--blue-1);border-radius:var(--radius);padding:14px;margin-top:12px}
  .inline-drawer h4{margin:0 0 10px;font-size:13.5px;color:#0958d9}

  /* ---------- 缺口提示 ---------- */
  .gapbox{border-left:3px solid var(--red);background:var(--red-1);border-radius:0 var(--radius) var(--radius) 0;padding:9px 13px;font-size:12.5px;color:#a8071a;margin-top:10px}
  .gapbox b{color:#820014}
  .okbox{border-left:3px solid var(--green);background:var(--green-1);border-radius:0 var(--radius) var(--radius) 0;padding:9px 13px;font-size:12.5px;color:#237804;margin-top:10px}

  /* ---------- 表单 ---------- */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;margin-bottom:4px;color:var(--text-2)}
  .field label .req{color:var(--red)}
  .field input,.field select,.field textarea{width:100%;border:1px solid #d9d9d9;border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;background:#fff}
  .field .help{font-size:11.5px;color:var(--text-3);margin-top:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}

  /* ---------- 时间线 ---------- */
  .tl{list-style:none;margin:0;padding:0}
  .tl li{position:relative;padding:0 0 15px 20px;border-left:2px solid var(--line)}
  .tl li:last-child{border-left-color:transparent;padding-bottom:0}
  .tl li:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--text-3)}
  .tl li.red:before{border-color:var(--red);background:var(--red-1)}
  .tl li.green:before{border-color:var(--green);background:var(--green-1)}
  .tl .tt{font-size:12px;color:var(--text-3)}
  .tl .tb{font-size:13px}
</style>
</head>

<div class="app">

  <!-- ================= 左侧导航（新 IA） ================= -->
  <aside class="sidebar">

</div>

/* 简易 SVG 折线图（零依赖） */
function lineChart(values, opts){
  opts = opts || {};
  const w = opts.w || 760, h = opts.h || 190, pad = 34;
  if (!values.length) return '<div class="empty">该时间范围内无数据</div>';
  const nums = values.map(Number).filter(v => !isNaN(v));
  if (!nums.length) return '<div class="empty">该点位读数为文本，无法绘制曲线</div>';
  let min = Math.min.apply(null, nums), max = Math.max.apply(null, nums);
  if (min === max){ min -= 1; max += 1; }
  const span = max - min;
  const x = i => pad + i * (w - pad * 2) / Math.max(values.length - 1, 1);
  const y = v => h - pad - (Number(v) - min) * (h - pad * 2) / span;
  const pts = values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const grid = [0,1,2,3,4].map(i => {
    const yy = pad + i * (h - pad * 2) / 4;
    const val = (max - i * span / 4).toFixed(1);
    return `<line x1="${pad}" y1="${yy}" x2="${w-pad}" y2="${yy}" stroke="#f0f1f3"/>
            <text x="${pad-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8f96a3">${val}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img">
    ${grid}
    <polyline points="${pts}" fill="none" stroke="${opts.color || '#1677ff'}" stroke-width="2"/>
    ${values.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${opts.color || '#1677ff'}"/>`).join('')}
  </svg>`;
}

/* ---------- 5.5 设备台账 ---------- */
function viewDevices(){
  const f = state.filter;
  let list = DB.devices.slice();
  if (f.kw) list = list.filter(d => (d.deviceCode+d.deviceName).toLowerCase().includes(f.kw.toLowerCase()));
  if (f.productId) list = list.filter(d => d.productId === f.productId);
  if (f.groupId) list = list.filter(d => (f.groupId==='__none' ? !d.groupId : d.groupId === f.groupId));
  if (f.status) list = list.filter(d => (f.status==='1' ? d.status===1 : d.status===0));

  const rows = list.map(d => {
    const lv = DB.latest[d.id] || {};
    const keys = Object.keys(lv).slice(0,2);
    const latest = keys.length ? keys.map(k=>`<span class="mono small">${esc(k)}=${esc(lv[k].v)}</span>`).join(' ') : '<span class="muted small">无数据</span>';
    const a = DB.availability[d.id];
    const o = (DB.outages[d.id]||[]).filter(x=>x.ongoing);
    return `<tr>
      <td><span class="link" data-act="go" data-to="#/devices/${d.id}"><b>${esc(d.deviceName)}</b></span>
          <div class="mono muted small">${esc(d.deviceCode)}</div></td>
      <td><span class="link" data-act="go" data-to="#/products/${d.productId}">${esc(prodName(d.productId))}</span>
          <div class="mono muted small">${esc(d.productVersion||'')}</div></td>
      <td>${d.groupId?`<span class="link" data-act="go" data-to="#/groups">${esc(grpName(d.groupId))}</span>`:'<span class="tag grey">未分组</span>'}</td>
      <td>${onlineTag(d.onlineStatus)}</td>
      <td class="mono small">${esc(d.lastSeenAt||'—')}</td>
      <td>${latest}</td>
      <td>${a?`<b style="color:${a.meetsTarget?'#389e0d':'#cf1322'}">${Number(a.availability).toFixed(4)}</b>`:'<span class="muted">—</span>'}</td>
      <td>${o.length?'<span class="tag red">进行中</span>':'<span class="tag green">正常</span>'}</td>
      <td class="acts">
        <button class="btn ghost" data-act="go" data-to="#/devices/${d.id}">详情</button>
        <button class="btn ghost" data-act="go" data-to="#/devices/${d.id}">可用率</button>
        <button class="btn ghost" data-act="go" data-to="#/devices/${d.id}">历史曲线</button>
      </td>
    </tr>`;
  }).join('');

  return `

   6. 渲染
   ========================================================================= */
const ROUTE_OF_DETAIL = { products:'products', devices:'devices' };

function currentNavId(){
  if (state.id && ROUTE_OF_DETAIL[state.route]) return state.route;
  return state.route;
}

function renderNav(){
  const cur = currentNavId();
  $('#nav').innerHTML = NAV.map(g => `
    <div class="nav-group">${esc(g.group)}</div>
    ${g.items.map(it => {
      const tag = it.tag === 'new' ? '<span class="tag-new">新增</span>'
                : it.tag === 'reuse' ? '<span class="tag-reuse">复用</span>'
                : it.tag === 'gap' ? '<span class="tag-gap">缺接口</span>' : '';
      const href = it.id === 'products' ? '#/products' : it.id === 'devices' ? '#/devices' : '#/' + it.id;
      return `<a href="${href}" class="${cur===it.id?'on':''}"><span class="ico">${it.icon}</span>${esc(it.label)}${tag}</a>`;
    }).join('')}`).join('');
}

function renderCrumb(){
  const map = {
    onboarding:['起步','接入向导'], templates:['① 接入配置','产品模板中心'], products:['① 接入配置','产品与物模型'],
    groups:['② 设备管理','设备分组'], devices:['② 设备管理','设备台账'],
    overview:['③ 运维中心','健康总览'], availability:['③ 运维中心','断档与可用率'],
    maintenance:['③ 运维中心','维护窗口'], alerts:['③ 运维中心','事件与告警'],
    series:['④ 数据与调试','时序查询'], debug:['④ 数据与调试','在线调试'], shadow:['④ 数据与调试','设备影子'],
    retention:['⑤ 系统','数据保留与清理'], ledger:['⑤ 系统','租户接入台账'], modelmap:['参考','关系图与口径']
  };
  const base = map[state.route] || ['IoT 平台',''];
  let parts = ['IoT 平台'].concat(base);
  if (state.id && state.route === 'products') parts.push(prod(state.id).name || state.id);
  if (state.id && state.route === 'devices') parts.push(dev(state.id).deviceName || state.id);
  $('#crumb').innerHTML = parts.map((p,i) => i === parts.length-1 ? `<b>${esc(p)}</b>` : esc(p)).join(' <span class="muted">/</span> ');
}

function render(){
  renderNav();
  renderCrumb();
  let html;
  switch (state.route){
    case 'onboarding':   html = viewOnboarding(); break;
    case 'overview':     html = viewOverview(); break;
    case 'products':     html = state.id ? viewProductDetail() : viewProducts(); break;
    case 'devices':      html = state.id ? viewDeviceDetail() : viewDevices(); break;
    case 'groups':       html = viewGroups(); break;
    case 'availability': html = viewAvailability(); break;
    case 'maintenance':  html = viewMaintenance(); break;
    case 'alerts':       html = viewAlerts(); break;
    case 'series':       html = viewSeries(); break;
    case 'debug':        html = viewDebug(); break;
    case 'shadow':       html = viewShadow(); break;
    case 'retention':    html = viewRetention(); break;
    case 'ledger':       html = viewLedger(); break;
    case 'modelmap':     html = viewModelMap(); break;
    case 'templates':    html = viewTemplates(); break;
    default:             html = '<div class="empty">未知页面</div>';
  }
  $('#view').innerHTML = html;
}

/* ---------- 模板中心 ---------- */
function viewTemplates(){
  const tpls = [
    { id:'th', name:'温湿度传感器', proto:'Modbus', type:'传感器',
      feats:'属性 3：temperature / humidity / battery\n命令 1：setReportInterval\n事件 2：overTemp / lowBattery\n点位 3：holding 0x0000/0x0001 · input 0x0008' },
    { id:'meter', name:'三相电表', proto:'Modbus', type:'电表',
      feats:'属性 3：voltageA / currentA / powerKw\n命令 1：resetEnergy\n事件 1：overCurrent\n点位 3：holding 0x0010/0x0012/0x0018' },
    { id:'gw', name:'边缘网关', proto:'MQTT', type:'网关',
      feats:'属性 4：cpu / mem / rssi / uptime\n命令 2：reboot / syncTime\n事件 1：linkDown\n点位 1：topic telemetry/#（MQTT 主题）' }
  ];
  return `
    ${anno('左侧「① 接入配置 → 产品模板中心」', '挑一个模板 → 「用此模板新建产品」→ 落在新建产品向导第一步并预填',
      '生成产品 + 物模型 + 点位模板后，直接去「添加设备」')}
    <h1 class="page">产品模板中心</h1>
    <div class="page-sub">把「常见型号的物模型 + 点位」沉淀成模板，让新用户不用从空白开始。</div>
    <div class="tpls">
      ${tpls.map(t=>`<div class="tpl">
        <h4>${esc(t.name)}</h4>
        <div class="meta">${esc(t.proto)} · ${esc(t.type)}</div>
        <div class="feats">${esc(t.feats).replace(/\n/g,'<br>')}</div>
        <div class="mt"><button class="btn primary" data-act="tpl" data-id="${t.id}">用此模板新建产品</button></div>
      </div>`).join('')}
    </div>
    <div class="gapbox">⚠️ <b>模板是新增能力，且有一手对标依据</b>：后端<b>没有</b>模板表/接口（全仓无 template 实体与端点）。
      阿里云的官方机制叫「<b>标准品类</b>」（官方文档原文标注"相当于产品模板"，功能分为必选/可选）；
      华为云支持「导入库模型 / Excel 导入」；涂鸦有产品模板与 DP 模板。
      <b>两种落地方式</b>：① <b>后端模板表 + API</b>（推荐，可维护、可租户化、可导入导出）；
      ② <b>前端内置静态模板 JSON + 逐条调用现有物模型接口</b>（最快，无需后端改动，但模板无法运营）。
      本原型只表达交互，不预设实现。</div>`;
}

/* =========================================================================
   7. 事件绑定
   ========================================================================= */
function toast(msg){
  let el = document.getElementById('__toast');
  if (!el){
    el = document.createElement('div');
    el.id = '__toast';
    el.style.cssText = 'position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#1d2433;color:#fff;' +
      'padding:9px 18px;border-radius:6px;font-size:13px;z-index:999;opacity:0;transition:opacity .18s;max-width:80vw';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el.__t);
  el.__t = setTimeout(() => { el.style.opacity = '0'; }, 1900);
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'go'){ ev.preventDefault(); go(el.dataset.to); return; }
  if (act === 'dtab'){ state.devTab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (act === 'ptab'){ state.prodTab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (act === 'wiz'){ state.wizardStep = Number(el.dataset.step); if (state.route !== 'onboarding') go('#/onboarding'); else render(); window.scrollTo(0,0); return; }
  if (act === 'tpl'){
    state.wizardStep = 2; state.wizardTpl = el.dataset.id;
    if (state.route !== 'onboarding') go('#/onboarding'); else render();
    toast('已按模板生成产品 + 物模型 + 点位模板（原型示意）');
    return;
  }
  if (act === 'adddev'){
    state.filter = { kw:'', productId: el.dataset.id, groupId:'', status:'' };
    if (state.route !== 'devices' || state.id) go('#/devices'); else render();
    toast('已带着产品跳转到设备台账 —— 点「+ 新增设备」即可（表单会预选该产品）');
    return;
  }
  if (act === 'newdev'){ state.wizardStep = 3; go('#/onboarding'); return; }
  if (act === 'maintain'){ go('#/maintenance'); toast('维护窗口表单已按来源预填作用范围（原型示意）'); return; }
  if (act === 'pub'){ toast('发布后将生成新版本并供设备绑定（原型示意，接口已存在）'); return; }
  if (act === 'noop'){ toast('设计原型：该动作在 IOT-UX-PROPOSAL.md 中描述，此处不实现'); return; }
});

document.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-filter]');
  if (!el) return;
  state.filter[el.dataset.filter] = el.value;
  const pos = el.selectionStart;
  render();
  const again = document.querySelector(`[data-filter="${el.dataset.filter}"]`);
  if (again && again.focus){ again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
});

document.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-filter]');
  if (el){ state.filter[el.dataset.filter] = el.value; render(); return; }
  const sc = ev.target.closest('[data-act="scope"]');
  if (sc){ MAINT.scope = sc.value; render(); return; }
});

/* =========================================================================
   8. 启动
   ========================================================================= */
parseHash();
if (!location.hash) location.hash = '#/onboarding';
render();
</script>
