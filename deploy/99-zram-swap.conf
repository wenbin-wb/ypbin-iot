# zram 压缩 swap 的成对持久化 —— swappiness 半边
#
# 为什么必须有这个文件（而不是只靠 zram-swap.service）：
#   zram-swap.service 的 ExecStart 会在建好 zram 之后把 vm.swappiness 设为 150（顺序正确），
#   但那是**运行期**赋值。本文件由 systemd-sysctl.service 在**每次开机早期**应用，
#   保证即使 zram 单元因故未执行到最后一步，swappiness 也不会回落到内核默认 60
#   —— 「有 zram 但 swappiness=60」≈ 等于没上 zram（内核会几乎不使用它）。
#
# 值 150 的依据（一手，内核文档 https://docs.kernel.org/admin-guide/sysctl/vm.html，访问 2026-09-26）：
#   "For in-memory swap, like zram or zswap ... values beyond 100 can be considered.
#    For example, if the random IO against the swap device is on average 2x faster than IO
#    from the filesystem, swappiness should be 133"
#   zram 是内存级设备，远快于本机 vda 云盘 ⇒ 取 150（文档公式在 k=4~10 时给 160~181，取 150 偏保守）。
#
# 文件名排序：`99-zram-swap.conf` 排在 `99-sysctl.conf`(→/etc/sysctl.conf) 之后 ⇒ 本文件的值最终生效。
#
# 回滚：systemctl disable --now zram-swap.service && rm -f /etc/sysctl.d/99-zram-swap.conf \
#         /etc/modules-load.d/zram.conf && sysctl -w vm.swappiness=60
vm.swappiness = 150
