# ============================================================
# ypbin-admin 微服务共享配置（Nacos 配置中心）
# Data ID: ypbin-common.yaml | Group: DEFAULT_GROUP | 格式: YAML
#
# 所有连接参数直接在此配置（不再依赖环境变量/本地 yml）。
# 数据库/Redis 与各服务同属 docker compose 网络，主机名用容器名：
#   mysql / redis / nacos
# 若服务以宿主机方式运行（java -jar），把主机名改为 localhost。
# ============================================================

# ---------- 数据库连接（所有连库服务共享）----------
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/ypbin_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # install.sh 导入 Nacos 时替换为 deploy/.env 的 MYSQL_ROOT_PASSWORD（仓库不提交真实密码）
    password: ${MYSQL_ROOT_PASSWORD}

# ---------- Redis（验证码/会话/缓存）----------
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      # install.sh 导入 Nacos 时替换为 deploy/.env 的 REDIS_PASSWORD（仓库不提交真实密码，
      # 与 compose 内建 Redis 的 requirepass 一致；NO_DOCKER 外部 Redis 且未设密码时该行被删除=不认证）
      password: ${REDIS_PASSWORD}

# ---------- Feign 显式超时（本仓铁律：远程调用禁止使用无超时默认 Client）----------
# ypbin-system 客户端是 auth/ai 唯一的跨服务通道（权限/用户/配置/日志上报），在此显式钉死；
# 覆盖 starter 注入的默认值（连接 5000ms / 读取 10000ms，见 starter-cloud-core
# FeignDefaultsEnvironmentPostProcessor:76-79）。读取 5000ms 意味着 system 慢于 5s 即失败并走
# ISystemClientFallback（返回失败 R，不静默），日志上报路径据此上抛异常而非无声丢失。
  cloud:
    openfeign:
      client:
        config:
          ypbin-system:
            connect-timeout: 2000
            read-timeout: 5000

# ---------- Sa-Token（auth/gateway 共享会话）----------
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000              # 固定有效期 30 天（秒）
  active-timeout: 1800          # 活跃超时 30 分钟（秒）
  auto-renew: true
  is-read-cookie: false
  is-print: false

# ---------- Sentinel 限流控制台 ----------
# 说明：此处原有一段 cloud.sentinel.transport.dashboard 配置，因错误缩进嵌套在 sa-token: 节下，
# 实际被解析为 sa-token.cloud.sentinel.* 而从未生效（死键，审计发现）。本部署栈
# （deploy/docker-compose.yml）不编排 sentinel-dashboard（控制台由 ypbin-starter 的 compose
# 单独提供，网络不同，sentinel-dashboard:8858 在本栈内不可解析），且 Sentinel 限流由 starter
# ypbin.cloud.sentinel.enabled（默认开）按本地规则工作、不依赖控制台，故删除该死键块。
# 日后如需接入控制台：将 spring.cloud.sentinel.transport.dashboard 配置到顶层 spring: 节下，
# 并确保控制台与本栈处于同一 docker 网络。

# ---------- 微服务身份头（网关签发，下游服务解析）----------
# starter 的 ypbin.security.identity（IdentityHeaderFilter，解析网关签发的身份头写入
# IdentityContext）随后续 starter 版本将改为默认关闭（matchIfMissing=false），此处显式开启，
# 保持 auth/system/ai 各 Servlet 服务既有行为不变；网关为 WebFlux，不装配该过滤器，本键对其无效。
#
# ⚠️ trusted-source-token 是**必填**项，不是可选项（starter 3.6.0 起，SF-5 修复引入）：
#   IdentityAutoConfiguration#identityHeaderFilterRegistration 在 enabled=true 且该键为空时抛
#   IllegalStateException ⇒ **应用启动即失败**（jar 内类：cn.ypbin.starter.security.identity.
#   IdentityProperties / IdentityAutoConfiguration）。同时 IdentityHeaderFilter 会逐请求校验网关
#   写出的 X-Gateway-Signed 标记，缺失或不匹配一律拒绝（fail-closed）——堵住"直连下游端口 +
#   伪造 X-User-Id 头 ⇒ 冒充任意用户"的越权路径（见 docs/STARTER-FEEDBACK.md SF-5）。
#   值与网关侧 ypbin.gateway.auth.trusted-source-token（deploy/nacos/ypbin-gateway.yaml）**必须同串**，
#   否则所有经网关的正常请求都会被下游判为非法来源而被拒（表现为全站 403）。
#   真值不入库：install.sh 导入 Nacos 时替换为 deploy/.env 的 GATEWAY_SIGN_TOKEN（600 权限）。
#   键名以 jar 内一手核实为准（勿写成旧命名空间的 ypbin.cloud.feign.*：那是 Feign 出站透传开关，
#   与"入口侧是否可信"是两件事，配错位置会得到"启动失败"或"静默不校验"两种都很难查的后果）。
ypbin:
  security:
    identity:
      enabled: true
      trusted-source-token: ${GATEWAY_SIGN_TOKEN}
  # ---------- 内部 Feign 调用凭证（/internal/** 服务间调用守卫）----------
  # 网关鉴权不覆盖 Feign 直连的 /internal/** 端点：system 服务守卫校验 X-Internal-Token 与
  # 本凭证一致，未配置（缺失/为空）即 fail-closed 拒绝。auth/system/ai 三服务同处本共享配置
  # （值一致），Feign 侧从同一键读取并写入凭证头；install.sh 导入 Nacos 时替换为
  # deploy/.env 的 INTERNAL_TOKEN（仓库不提交真实值）。
  internal:
    token: ${INTERNAL_TOKEN}
