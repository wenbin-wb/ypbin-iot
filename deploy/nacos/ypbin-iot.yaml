# ============================================================
# ypbin-iot 服务配置（Nacos 配置中心）
# Data ID: ypbin-iot.yaml | Group: DEFAULT_GROUP | 格式: YAML
# ============================================================

ypbin:
  tenant:
    enabled: true
    # fail-closed：无租户上下文时拒绝执行。IoT 业务全部按租户隔离（设备台账继承 TenantBaseEntity），
    # 因此这里保持拒绝——任何绕过租户的写法都会在开发期暴露，而不是悄悄查全表。
    fail-on-missing-tenant: true
    # ⚠️ 平台表必须登记在这里：/internal/lease/** 是 access 直连（只有 X-Internal-Token，没有租户身份头），
    # 不登记的话租户插件会给租约的每条 SQL 追加 tenant_id 条件，并在无租户上下文时直接抛异常
    # ⇒ 领取/续约/释放/失效扫描**全部不可用**（不是少个优化，是整个增量不工作）。
    ignore-tables:
      - tenant_node_assignment
      # M0b-1/M0b-2 平台表：节点注册表与租户台账都不按租户隔离（台账本身就是「租户清单」）
      - access_node
      - tenant_ledger
  # 身份头来源校验：仅信任带网关签名标记的身份头；未配置密钥则拒绝启动（fail-fast）
  cloud:
    feign:
      trusted-source-token: ${GATEWAY_SIGN_TOKEN}
      require-trusted-source: true
  data-permission:
    enabled: true
  # iot 为下游业务服务，登录态由网关校验并注入身份头；
  # 关闭本地 Sa-Token 全局拦截（键是 ypbin.security.interceptor，由 starter 的 SecurityProperties 绑定；
  # 写成 ypbin.sa-token.* 不存在的键会**静默无效**——复核用 `--key=value` 差分实测过：
  # 传 ypbin.sa-token.enabled=false 时 saTokenWebConfigurer 仍 matched）。
  security:
    interceptor: false

  # EMQX 接入（设计 §8.4，落地形态见 docs/EMQX-INTEGRATION.md §2 的拓扑与方向）
  # ⚠️ api-key/api-secret 写的是**占位符**：真值只在 deploy/.env(600) 与容器 env 里，
  #    由 Spring 读取本配置时从 Environment 解析（方案 α）。**不要把真值填进本文件**——
  #    本文件会进 Nacos 配置库（= 落库），而这是能改 ACL/建用户的全权凭据（见 .env.example 的说明）。
  # base-url 指向**生产机上的出向隧道**：隧道把 EMQX 管理面绑到 docker 网桥网关 172.20.0.1:18093
  #    （容器到不了宿主回环；绑 0.0.0.0 会把 EMQX 管理面暴露到公网）。方向见 docs/EMQX-INTEGRATION.md §2。
  emqx:
    # false 时装配「不可用实现」：调用点显式报错（不静默降级），但平台侧凭据的签发/校验照常可用
    enabled: true
    base-url: http://172.20.0.1:18093
    api-key: ${EMQX_API_KEY}
    api-secret: ${EMQX_API_SECRET}
    # 远程调用必须显式超时（仓内铁律；禁止无超时默认客户端）
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    # 「接入信息」端点回给前端的 broker 地址（只用于展示与二维码，不含口令）。
    # ⚠️ 这是**中间件机**上 EMQX 的真实地址；但 1883 **当前只绑该机回环**（未对设备开放，
    #    见 docs/EMQX-INTEGRATION.md §8 U-A1）⇒ 此处是"登记的真实地址"，不是"已验证可接入"。
    #    不用 ${...} 占位符：本文件也过 install.sh 的 sed，而它只替换 4 个固定键，
    #    新占位符既不会被替换也不会报错，只会多一层"以为配了、其实没配"的错觉（同 IoTDB 口令的取舍）。
    broker-host: 43.242.200.8
    broker-port: 1883
    broker-tls-enabled: false
    # 设备口令随机字节数（32 字节 = 256 位熵）
    credential-password-length: 32
    # 下行发布（段 B）
    downlink-qos: 1
    downlink-retain: false
    # 下行命令默认超时（毫秒）：**不小于**入站动作的 request_ttl=30s（评审确认口径），
    # 否则 EMQX 还在重发时平台就把命令判超时；单条命令可用端点入参 timeoutMs 覆盖。
    default-command-timeout-ms: 30000
    # 超时扫描（周期批量；**不自动重试**——重发是人在页面上的动作）
    command-scan-interval-ms: 15000
    command-scan-batch-size: 200

  # 数据保留（D0.8）：断档事件与维护窗口按 13 个月清理（**不可逆**，天数必须为正，启动自检会拒绝非法值）。
  # 只删**已闭合**的行：进行中的断档/维护窗口是活数据，删掉会让可用率 fail-open。
  retention:
    enabled: true
    outage-event-days: 396
    maintenance-window-days: 396
    cleanup-interval-ms: 86400000
    initial-delay-ms: 300000

  # 告警与阈值（设计 docs/ALERTING-DESIGN.md；用户已批准口径见任务回执）。
  # ⚠️ `enabled=false` 时**接口返回明确失败而不是空列表**（空列表会被读成「没有告警」= 最危险的假阴性）。
  # 下面的数值都是「开箱可用」的那一档；改任何一个都会改变线上行为，故全部显式写出而不是靠代码默认值。
  alert:
    enabled: true
    # 评估周期（15s 量级 = 用户批准的「触发到通知延迟」口径；与既有 OutageScanner 同量级）
    evaluate-interval-ms: 15000
    evaluate-initial-delay-ms: 10000
    # 单轮最多评估的设备数（超出跨轮滚动并计数，不静默丢弃）
    evaluate-batch-size: 500
    # 陈旧判定：倍数 × 采集周期（取不到周期时用 fallback）；上限防「采集周期配成 1 小时」把陈旧判定废掉
    staleness-interval-multiplier: 3
    staleness-fallback-ttl-ms: 90000
    staleness-max-ttl-ms: 3600000
    # 默认抖动抑制：连续 3 次；缺省级别「警告」、渠道「站内信 + 邮件」；重复通知 10 分钟（用户口径）
    default-trigger-threshold: 3
    default-pending-ttl-sec: 300
    default-repeat-interval-sec: 600
    default-severity: WARNING
    default-notify-channels: INBOX,EMAIL
    max-points-per-rule: 50
    max-page-size: 200
    # 断档 → 告警映射（**opt-in**：只在设备被「启用且无点位条件」的规则覆盖时才产生离线告警）
    outage-enabled: true
    outage-scan-interval-ms: 15000
    outage-initial-delay-ms: 20000
    outage-batch-size: 200
    # 保留：活动告警**永久保留**，已恢复按 180 天清理（告警是审计证据，故比时序数据保留更久）
    retention-resolved-days: 180
    retention-cleanup-interval-ms: 86400000
    retention-initial-delay-ms: 300000
    retention-batch-size: 1000
    # 通知投递：1 次首发 + 3 次重试（三级退避 30s→2min→10min 全部生效）、每渠道每分钟 60 条
    # （超出的**延后**不丢弃）
    notify-enabled: true
    notify-max-attempt: 4
    notify-backoff-seconds: 30,120,600
    notify-throttle-per-minute: 60
    notify-dispatch-batch-size: 200
    notify-dispatch-interval-ms: 10000
    notify-initial-delay-ms: 15000
    notify-max-error-length: 500
    notify-max-text-length: 2000
    # 兜底收件人（为空 = 只回落「规则创建者」）：规则没配收件人时用它，避免「通知了一条没人收的站内信」
    notify-fallback-inbox-user-ids: []
    notify-fallback-emails: []

  # 租约维护（增量 2）：契约与语义见 docs/LEASE.md。
  # ttl 必须大于 expected-renew-interval + 4s（一次内部调用最坏耗时），启动自检会拒绝不合法组合。
  lease:
    enabled: true
    ttl: 30s
    scan-interval-ms: 15000
    expected-renew-interval: 10s
    # 允许分配的租户：为空 = **不分配任何**租户（不是「分配全部」）；M0b 起改为读台账表
    assignable-tenant-ids: []

  # 断档与可用率（M-2）：口径见 docs/IOT-PLATFORM-DESIGN.md §5.4，常量见 AvailabilityRules。
  # 参数不合法会在启动期被拒（K=0 会让任何时刻都算断档，是运行期最难查的一类错）。
  availability:
    enabled: true
    # 断档 = 连续 > k-factor × 采集周期 无有效数据（quality=GOOD）
    k-factor: 2
    # 采集周期未知（access 尚未上报真值）时的兜底周期
    fallback-interval-ms: 5000
    scan-interval-ms: 15000
    # 单次扫描最多处理的候选设备数（防一次扫描把库与线程拖住，下轮继续）
    scan-batch-size: 200
    # 查询未给 from 时的默认窗口时长
    default-window-hours: 24

  # 时序库（Apache IoTDB 表模型，D0.7/§5.2.1）：部署、初始化与排障见 docs/DEPLOY-TIMESERIES.md。
  # enabled=true 时服务启动做**驱动自检**：url 为空、batch-size/connect-timeout-ms 非正、表名非法
  # → **启动即拒绝**（fail-fast，不静默降级）；表名会被拼进 SQL，故只允许字母/数字/下划线。
  # ⚠️ 部署前置（已核实，阻塞级）：**驱动必须真的被注册，光在类路径上不够**——
  #   org.apache.iotdb:iotdb-jdbc:2.0.1-beta 的 jar **没有** META-INF/services/java.sql.Driver
  #   （Central 制品核验：META-INF/services 条目 0 个）⇒ JDBC 4 的 SPI 自动注册不会发生，必须由代码显式
  #   Class.forName("org.apache.iotdb.jdbc.IoTDBDriver")（IotDbDriverRegistrar.ensureRegistered()）。
  #   缺这段注册代码时，enabled=true 会让 ypbin-iot **启动即失败**（DriverManager.getDriver 抛 SQLException
  #   → IotTimeSeriesConfiguration 抛 IllegalStateException）⇒ 部署前请确认注册代码在你部署的提交里，
  #   否则先把 enabled 改回 false。详见 docs/DEPLOY-TIMESERIES.md §0.6。
  timeseries:
    enabled: true
    # ⚠️ URL 必须带库名 /iot：写入器与查询用的是**非限定表名**（INSERT INTO reading（…） / FROM reading），
    # 而 IoTDB 对「未指定数据库」时的这类语句直接报 701: database is not specified（官方文档给出的错误输出）；
    # 表模型还**必须**带 sql_dialect=table（官方 JDBC 文档）。带库名的 URL 形式同官方示例
    # jdbc:iotdb://127.0.0.1:6667/test1?sql_dialect=table。
    url: jdbc:iotdb://ypbin-iotdb:6667/iot?sql_dialect=table
    # 下面是 IoTDB 官方**默认**用户/口令（官方 Authority Management：默认用户 root、默认口令 root）。
    # ⚠️ 生产**必须**轮换（官方默认口令是公开的），见 docs/DEPLOY-TIMESERIES.md §6.1：本文件里的这个值
    #   只是**模板默认值**，生效值在 **Nacos 活配置**里（轮换只改 live，不整份覆盖模板）。
    #   本仓**不记录**线上口令状态（口令值不入库）；执行记录落在轮换工作目录（700）与部署回执里。
    # ⚠️ 为什么这里不写 ${IOTDB_PASSWORD} 之类的占位符：本文件也过 install.sh 那段 sed，
    #   而 install.sh 的可替换键固定为 MYSQL_ROOT_PASSWORD / REDIS_PASSWORD / INTERNAL_TOKEN /
    #   GATEWAY_SIGN_TOKEN 四个（本文件里的 ${GATEWAY_SIGN_TOKEN} 正是其中之一）
    #   ⇒ 新占位符既不会被替换、也不会被自动生成，只会多一层"以为配了、其实没配"的错觉。
    #   同样的原因：**全新安装仍需人工改口令**（install.sh 改不了 IoTDB 内的口令）——这是已登记的未修项。
    # 改口令是**三处联动**（漏一处就会以 801 失败）：
    #   1) IoTDB 侧（官方语法 ALTER USER，需 root 身份，见 docs/DEPLOY-TIMESERIES.md §6.1）：
    #      { printf '%s\n' "$OLD"; printf "ALTER USER root SET PASSWORD '%s';\n" "$NEW"; } \
    #        | docker exec -i ypbin-iotdb bash -c 'start-cli.sh -h ypbin-iotdb -p 6667 -u root -pw -sql_dialect table'
    #      （第一行 stdin 必须是**当前**口令、后面才是 SQL；裸 `-pw` ⇒ 口令不进 argv。
    #        交互式执行的退出码不可靠 ⇒ 轮换后用"新口令能连、旧口令被拒且报 801"复核结果，见 §6.1 判据）
    #      （⚠️ 必须带 -h ypbin-iotdb：dn_rpc_address 是绑定地址、服务端只绑容器 eth0，用 CLI 默认的
    #        127.0.0.1 连不上；本机实测见 docs/DEPLOY-TIMESERIES.md §5/§7）
    #   2) 本文件 password 改成同一个值（活配置；用 tools/rotate-iotdb-password.py，别整份覆盖），再重启 ypbin-iot
    #   3) deploy/.env 的 IOTDB_PASSWORD——compose 用它注入 iotdb-init 服务（建库建表）；
    #      缺了它 iotdb-init 会**显式失败退出 1**（不会回退到公开默认口令）
    username: root
    password: root
    # 表名，必须与 deploy/iotdb-init.sql 建的表一致
    table-name: reading
    # 一次 addBatch/executeBatch 的行数上限
    batch-size: 500
    # 连接超时（毫秒）。JDBC 只有全局登录超时，启动自检会用本值调用 DriverManager.setLoginTimeout
    connect-timeout-ms: 3000

  # 开放 API 文档（看板 #11 门面/F-3：ypbin-starter-api-doc，注解 + 代码生成）。
  # 安全必修（前置核验 U-6 的 R-1/R-2/R-3）：
  #   ① paths-to-match 只圈 /open-api/v1/** —— 默认值 /** 会把全部管理面端点写进对外规范；
  #   ② security-headers 显式覆盖默认值（默认含 X-Tenant-Id 等管理面头，会误导第三方以为可自选租户）；
  #      v1 只用 X-Api-Key（ak:sk bearer，无签名头）；
  #   ③ disable-in-prod 保持 true，但注意它只在激活 prod profile 时生效（starter
  #      ApiDocDefaultsEnvironmentPostProcessor 按 profile 名判定）；本生产 compose 未激活任何
  #      profile（F-4 已核实）⇒ 该开关在现网不生效，实际边界靠下面两条：
  #      网关 exclude-paths 未放行 /iot/v3/api-docs（须登录态）+ 18084 只绑回环。
  api-doc:
    title: IoT 开放 API
    version: v1
    disable-in-prod: true
    paths-to-match:
      - /open-api/v1/**
    security-headers:
      - X-Api-Key
    # 已核实（dev 实测 + starter 一手源码）：上组收窄只作用于具名分组
    # （/v3/api-docs/default = 19 条全为 /open-api/v1/**）；未分组的 /v3/api-docs
    # 仍列出全部路径（springdoc 原生行为，groups.enabled 在 3.1.1 实测无此效果，
    # 故不配该键）。实际边界：网关 exclude-paths 未放行 /iot/v3/api-docs（须登录态）
    # + 18084 只绑回环 ⇒ 第三方（Key）够不着，对外只给分组地址。

# ---------- 可观测（Spring Boot Actuator，2026-09-26 新增）----------
# 为什么要有这一段：本轮新增/既有的入站指标（iot.ingest.latest.regressed / future_rejected / failed、
# iot.ingest.propertyid.rejected / unmapped / orphan、iot.pointmapping.orphan、iot.access.egress.* …）
# 在生产**只能靠日志观测**——`/actuator/metrics` 默认不暴露（Spring Boot 4.1.1 的
# management.endpoints.web.exposure.include 默认只有 health）⇒ 出了乱序/丢点位/孤儿映射，
# 值班只能翻日志、看不到计数趋势。
#
# ⚠️ 安全边界（改这一段前务必读完，见 docs/DEPLOY-BACKEND.md §5）：
#   1) **只开只读且必要的最小集合，绝不用 `*`**：`*` 会连带 env / configprops / heapdump /
#      threaddump / beans / loggers / mappings 等端点，其中 heapdump 可直接导出堆内存（含 DB/Redis
#      口令、内部 token），env/configprops 会回显全部配置。**这些端点一旦暴露等于把凭据交出去。**
#   2) **只在内网/回环可达**：本服务的 18084 在 compose 里**只绑 127.0.0.1**
#      （`${IOT_BIND_ADDR:-127.0.0.1}:18084:18084`，刻意与 INTERNAL_BIND_ADDR 分开）⇒ 公网打不通；
#      容器网络内（网关/内部服务）可达属"内网"。**不要把 18084 改绑到 0.0.0.0**：
#      Actuator 端点默认**没有认证**（Sa-Token 拦截器在本服务是关闭的），绑公网 = 指标与健康细节裸奔。
#   3) 网关上 `/iot/actuator/**` 会 StripPrefix 后转发到本服务，但网关鉴权白名单**没有**放行它
#      （deploy/nacos/ypbin-gateway.yaml 的 exclude-paths）⇒ 必须带登录态才能穿过网关；直接打 18084 才绕过网关，
#      所以"18084 只绑回环"是这条链路的实际边界。
#   4) 只读性：metrics/info 是只读端点；health 已关掉细节与组件展示（show-details/show-components=never），
#      只回 status，不会泄露数据库/中间件地址与异常堆栈。
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: never
      show-components: never
    metrics:
      enabled: true

# 调度线程池：本服务有 9 个 @Scheduled（既有断档/命令超时/保留清理/租约失效 + 告警的评估/投递/
# 断档映射/清理）。默认 1 个线程时，一次慢评估会推迟既有 OutageScanner（可用率链路）——
# 独立复核 2026-10-03 M8 指出。这里给 4 个线程（仍远小于连接池容量）。
spring:
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: ypbin-iot-sched-
