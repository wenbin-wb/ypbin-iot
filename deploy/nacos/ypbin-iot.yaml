# ============================================================
# ypbin-iot 服务配置（Nacos 配置中心）
# Data ID: ypbin-iot.yaml | Group: DEFAULT_GROUP | 格式: YAML
# ============================================================

ypbin:
  tenant:
    enabled: true
    # fail-closed：无租户上下文时拒绝执行。IoT 业务全部按租户隔离（设备台账继承 TenantBaseEntity），
    # 因此这里保持拒绝——任何绕过租户的写法都会在开发期暴露，而不是悄悄查全表。
    fail-on-missing-tenant: true
    # ⚠️ 平台表必须登记在这里：/internal/lease/** 是 access 直连（只有 X-Internal-Token，没有租户身份头），
    # 不登记的话租户插件会给租约的每条 SQL 追加 tenant_id 条件，并在无租户上下文时直接抛异常
    # ⇒ 领取/续约/释放/失效扫描**全部不可用**（不是少个优化，是整个增量不工作）。
    ignore-tables:
      - tenant_node_assignment
      # M0b-1/M0b-2 平台表：节点注册表与租户台账都不按租户隔离（台账本身就是「租户清单」）
      - access_node
      - tenant_ledger
  # 身份头来源校验：仅信任带网关签名标记的身份头；未配置密钥则拒绝启动（fail-fast）
  cloud:
    feign:
      trusted-source-token: ${GATEWAY_SIGN_TOKEN}
      require-trusted-source: true
  data-permission:
    enabled: true
  # iot 为下游业务服务，登录态由网关校验并注入身份头；
  # 关闭本地 Sa-Token 全局拦截（键是 ypbin.security.interceptor，由 starter 的 SecurityProperties 绑定；
  # 写成 ypbin.sa-token.* 不存在的键会**静默无效**——复核用 `--key=value` 差分实测过：
  # 传 ypbin.sa-token.enabled=false 时 saTokenWebConfigurer 仍 matched）。
  security:
    interceptor: false

  # 数据保留（D0.8）：断档事件与维护窗口按 13 个月清理（**不可逆**，天数必须为正，启动自检会拒绝非法值）。
  # 只删**已闭合**的行：进行中的断档/维护窗口是活数据，删掉会让可用率 fail-open。
  retention:
    enabled: true
    outage-event-days: 396
    maintenance-window-days: 396
    cleanup-interval-ms: 86400000
    initial-delay-ms: 300000

  # 租约维护（增量 2）：契约与语义见 docs/LEASE.md。
  # ttl 必须大于 expected-renew-interval + 4s（一次内部调用最坏耗时），启动自检会拒绝不合法组合。
  lease:
    enabled: true
    ttl: 30s
    scan-interval-ms: 15000
    expected-renew-interval: 10s
    # 允许分配的租户：为空 = **不分配任何**租户（不是「分配全部」）；M0b 起改为读台账表
    assignable-tenant-ids: []

  # 断档与可用率（M-2）：口径见 docs/IOT-PLATFORM-DESIGN.md §5.4，常量见 AvailabilityRules。
  # 参数不合法会在启动期被拒（K=0 会让任何时刻都算断档，是运行期最难查的一类错）。
  availability:
    enabled: true
    # 断档 = 连续 > k-factor × 采集周期 无有效数据（quality=GOOD）
    k-factor: 2
    # 采集周期未知（access 尚未上报真值）时的兜底周期
    fallback-interval-ms: 5000
    scan-interval-ms: 15000
    # 单次扫描最多处理的候选设备数（防一次扫描把库与线程拖住，下轮继续）
    scan-batch-size: 200
    # 查询未给 from 时的默认窗口时长
    default-window-hours: 24

  # 时序库（Apache IoTDB 表模型，D0.7/§5.2.1）：部署、初始化与排障见 docs/DEPLOY-TIMESERIES.md。
  # enabled=true 时服务启动做**驱动自检**（org.apache.iotdb:iotdb-jdbc 已在 ypbin-iot 的 runtime 依赖里）：
  # 驱动不在类路径、url 为空、batch-size/connect-timeout-ms 非正、表名非法 → **启动即拒绝**（fail-fast，
  # 不静默降级）；表名会被拼进 SQL，故只允许字母/数字/下划线。
  timeseries:
    enabled: true
    # ⚠️ URL 必须带库名 /iot：写入器与查询用的是**非限定表名**（INSERT INTO reading（…） / FROM reading），
    # 而 IoTDB 对「未指定数据库」时的这类语句直接报 701: database is not specified（官方文档给出的错误输出）；
    # 表模型还**必须**带 sql_dialect=table（官方 JDBC 文档）。带库名的 URL 形式同官方示例
    # jdbc:iotdb://127.0.0.1:6667/test1?sql_dialect=table。
    url: jdbc:iotdb://ypbin-iotdb:6667/iot?sql_dialect=table
    # 下面是 IoTDB 官方**默认**用户/口令（官方 Authority Management：默认用户 root、默认口令 root）。
    # 它不是本平台的部署密钥，所以和 ypbin-common.yaml 的 datasource.username: root 一样直写；
    # ⚠️ 但默认口令是公开的 ⇒ 生产必须改，且改口令是**两处联动**（IoTDB 侧 + 本文件）：
    #   1) IoTDB 侧（官方语法 ALTER USER，需 root 身份，见 docs/DEPLOY-TIMESERIES.md §6）：
    #      docker exec -it ypbin-iotdb start-cli.sh -sql_dialect table -e "ALTER USER root SET PASSWORD '新口令'"
    #   2) 本文件 password 改成同一个值，重导 Nacos（或直接在 Nacos 控制台改），再重启 ypbin-iot
    #   注意：本文件**不走** install.sh 的占位符替换——它的替换键固定为 MYSQL_ROOT_PASSWORD /
    #   REDIS_PASSWORD / INTERNAL_TOKEN / GATEWAY_SIGN_TOKEN 四个，所以别在这里写 ${IOTDB_PASSWORD} 之类：
    #   那样既不会被替换、也不会被自动生成，只会多一层"以为配了、其实没配"的错觉。
    username: root
    password: root
    # 表名，必须与 deploy/iotdb-init.sql 建的表一致
    table-name: reading
    # 一次 addBatch/executeBatch 的行数上限
    batch-size: 500
    # 连接超时（毫秒）。JDBC 只有全局登录超时，启动自检会用本值调用 DriverManager.setLoginTimeout
    connect-timeout-ms: 3000
