# ============================================================
# ypbin-gateway 服务配置（Nacos 配置中心）
# Data ID: ypbin-gateway.yaml | Group: DEFAULT_GROUP | 格式: YAML
# ============================================================

# Sa-Token 与 auth 保持一致，确保网关能读取 Redis 中的登录会话
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 1800
  auto-renew: true
  is-read-cookie: false
  is-print: false

# Spring Cloud 2025.1.2 官方支持 Boot 4.1.x，兼容性检查器元数据滞后误报，显式禁用
spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 约定：URL 第一段 = 服务短名（system/auth/ai），转发前 StripPrefix 剥掉短名段，
            # 服务内 controller 一律写纯资源路径（如 /user/list）；新增 controller 挂本服务短名下即可，无需改本表。
            - id: auth
              uri: lb://ypbin-auth
              predicates:
                - Path=/auth/**,/auth/social/**
              filters:
                - StripPrefix=1
            - id: system
              uri: lb://ypbin-system
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
            - id: ai
              uri: lb://ypbin-ai
              predicates:
                - Path=/ai/**
              filters:
                - StripPrefix=1
            - id: iot-openapi
              uri: lb://ypbin-iot
              # 开放 API（看板 #11 门面）：只剥服务短名、保留 /open-api/v1 前缀落到 iot 门面
              predicates:
                - Path=/iot/open-api/v1/**
              filters:
                - RewritePath=/iot/(?<seg>.*), /${seg}
            - id: iot
              uri: lb://ypbin-iot
              predicates:
                - Path=/iot/**
              filters:
                - StripPrefix=1

# 统一鉴权：校验 token 后清洗外部头、签发内部身份头
ypbin:
  # ---------------------------------------------------------------------------
  # 开放 API 签名（请求防篡改 + 防重放）
  #
  # require-signature 是**灰度开关**：
  #   false（当前）—— 兼容既有"仅 X-Api-Key"接入；但带了签名参数的请求仍会被严格校验
  #                    （带参数却不齐备一律拒绝，防"部分携带"降级）。
  #   true          —— 强制签名：缺少 timestamp/nonce/sign 的请求直接 401。
  #
  # ⚠️ 该开关由网关下发到 iot（随内部校验请求的 requireSignature 字段）。
  #    **不可**改成"由 iot 看请求里有没有签名参数自行判断"——那样攻击者只要
  #    不带这些参数就能落进"未启用签名"分支被放行，签名形同虚设。
  #
  # 推进路径：确认第三方完成签名改造后置 true。切换前建议先看
  # iot 日志中"携带了不完整的签名参数，拒绝"的出现频率。
  # ---------------------------------------------------------------------------
  openapi:
    require-signature: false
  gateway:
    # -------------------------------------------------------------------------
    # 入口身份头清洗（SF-5 纵深防御，2026-09-29 补）
    #
    # starter 默认清洗表是 X-User-Id/X-User-Name/X-Tenant-Id/X-Dept-Id/X-Roles，
    # **不含 X-Gateway-Signed**（jar 内 GatewayProperties$HeaderSanitize:180-181）。
    # 后果：客户端可自带一个 X-Gateway-Signed 头穿透到下游。下游 IdentityHeaderFilter
    # 仍要求它等于密钥（不知密钥就伪造不出来），但
    #   ① 密钥一旦因任何途径泄露，唯一兜底也没了；
    #   ② "外部头能否直达下游"不该依赖"密钥没泄露"才成立。
    # 故显式把来源标记头并入清洗表：网关先删客户端同名头，再由 GatewayAuthGlobalFilter
    # 用真值重新签发（清洗 order = HIGHEST_PRECEDENCE+1，签发 = +2 ⇒ 顺序正确）。
    #
    # ⚠️ 必须列全：本键一旦设置就**整体覆盖** starter 默认表（不是追加），
    #    漏写任何一个身份头都等于取消对该头的清洗。
    #    tools/check-identity-config.sh 断言本表含默认 5 头 + X-Gateway-Signed。
    # ⚠️ 本键是**启动期**绑定（GatewayProperties），改完需重启网关容器才生效。
    # -------------------------------------------------------------------------
    header-sanitize:
      enabled: true
      headers:
        # 以下 5 个 = starter 默认表，原样保留（覆盖语义，不是追加）
        - X-User-Id
        - X-User-Name
        - X-Tenant-Id
        - X-Dept-Id
        - X-Roles
        # IoT 补：来源标记头，防客户端预置/探测（SF-5 纵深防御）
        - X-Gateway-Signed
    auth:
      enabled: true
      # 身份头签名：网关在写入 X-User-Id 等身份头的同时签发该标记，
      # 下游 service 据此判定身份头来源可信（防直连伪造身份经 Feign 放大越权）。
      # 值与 auth/system/ai 的 ypbin.cloud.feign.trusted-source-token 必须一致。
      trusted-source-token: ${GATEWAY_SIGN_TOKEN}
      # 白名单路径（无需登录即可访问）
      exclude-paths:
        - /auth/login
        - /auth/sms/send
        - /auth/sms/login
        - /auth/social/authorize/**
        - /auth/social/callback/**
        - /auth/social/platforms
        # 免登录段统一挂服务短名下（URL 第一段=短名，转发时剥短名）
        - /auth/captcha/**
        - /system/open-api/**
        - /system/open/license/**
        - /ai/share/**
        - /ai/widget/**
        # SSE 订阅：EventSource 无法携带 Authorization，靠一次性 ticket 换身份（ticket 由登录态签发）
        - /system/ypbin/sse/subscribe
        # 埋点采集端点：登录前后都要上报（匿名事件占多数），故放行；防护由限流 + 体积/事件数上限 + 事件码白名单承担
        - /system/tracking/ingest
        # API Key 路径免会话登录（OpenApiKeyAuthFilter 接管）
        - /iot/open-api/**
    # -------------------------------------------------------------------------
    # 开放 API 限流/配额（starter 通用实现；iot 自研副本已删除去重）
    #
    # starter `AttributeRateLimitGlobalFilter`（ypbin-starter-cloud-gateway 3.7.0 起可用）
    # 与已删除的 `OpenApiRateLimitGlobalFilter` 逻辑等价：固定窗口 Redis INCR+EXPIRE
    # （QPS 秒级窗口 + 自然日配额），`limit<=0` 不限，Redis 异常 fail-open。
    # 装配是**三重条件**：classpath 有 ReactiveStringRedisTemplate +
    # 容器中有该 Bean + 本节 `enabled=true`，缺一即不装配（不报错）。
    #
    # 🔴 以下三项**缺一即静默不限流**（不报错，只放行）——改动本节后必须实测 429：
    #   ① `enabled`：starter 默认 false，不显式开则过滤器根本不装配；
    #   ② `path-prefixes`：starter 默认空列表，空列表恒不命中 ⇒ 全部路径都不限流；
    #   ③ `*-attribute`：starter 默认 `rate-limit.*`，须与 `OpenApiKeyAuthFilter` 的
    #      `ATTR_*` 常量一致（`openapi.*`），否则取不到维度键 ⇒ 直接放行。
    # -------------------------------------------------------------------------
    rate-limit:
      enabled: true
      path-prefixes:
        - /iot/open-api/v1/
      # 与 OpenApiKeyAuthFilter.ATTR_ACCESS_KEY / ATTR_RATE_QPS / ATTR_DAILY_QUOTA 对齐
      key-attribute: openapi.accessKeyId
      qps-attribute: openapi.rateLimitQps
      quota-attribute: openapi.dailyQuota
      window-seconds: 1
      default-qps: 10
      default-quota: 100000
      # Redis key 前缀沿用旧自研实现的命名（ypbin:openapi:*），而不用 starter 默认
      # （ypbin:ratelimit:*）：切换瞬间若换前缀，旧计数会被丢弃 ⇒ 全租户日配额被"重置"
      # （等于一次性多发配额）。沿用旧前缀则计数连续，无感切换。
      qps-key-prefix: "ypbin:openapi:qps:"
      quota-key-prefix: "ypbin:openapi:quota:"
