# =============================================================================
# EMQX 5.8.9 —— ypbin IoT 平台的 MQTT 接入中间件（**中间件机独立 compose 项目**）
# =============================================================================
# 目标机：43.242.200.8:61260（Ubuntu 24.04，8C/15991MB）
#
# 🔴 与「别人的项目」零共享（中间件机上还跑着 aicomic-mysql / aicomic-minio / sub2api / 宝塔）：
#   · 独立 compose 项目（`name: emqx-edge`，与 app / middleware 项目无关）
#   · 独立 network（`emqx-edge`，172.28.0.0/16；**不接入** middleware_default / app_default / baota_net）
#   · 独立 named volume（emqx-data / emqx-log），不使用任何别人的卷
#   · **不触碰**别人的容器/镜像/卷/网络/配置，也不改宝塔 vhost
#   · 禁止 `docker system prune -a` / `docker volume prune` / `docker network prune`
#
# 设计依据：ypbin-iot/docs/EMQX-INGRESS-DESIGN.md（§5.2 ACL、§8.1 compose、§8.2 暴露面、§8.3 资源）
# 部署文档：ypbin-iot/docs/EMQX-DEPLOY.md
#
# 真源与优先级（官方镜像 emqx.conf 头部原文）：
#   etc/base.hocon < cluster.hocon < etc/emqx.conf < **环境变量**
#   ⇒ 本文件挂载的 emqx.conf 是 ACL/认证/监听/限量的唯一真源；
#     仅「口令类」值走环境变量（.env，600，不入库），避免密钥进配置模板。
#
# commands:
#   compose-up:    cd /opt/emqx && docker compose up -d emqx
#   gen-certs:     bash /opt/emqx/gen-certs.sh                 # 自签 CA + 服务端证书（幂等；仅开发测试期）
#   tls-selfcheck: bash /opt/emqx/emqx-tls-selfcheck.sh        # TLS 8883 验收（握手 + 鉴权 + 凭据连接）
#   tls-rollback:  bash /opt/emqx/emqx-tls-rollback.sh         # 一行回滚（撤回 8883 发布并重建容器）
#   watch:         bash /opt/emqx/emqx-mqtt-expose-watch.sh    # 只读巡检（含 8883 判据；只告警不自愈）
# =============================================================================

name: emqx-edge

services:
  emqx:
    # pin 具体补丁版（禁止浮动 tag）：官方镜像 emqx 自 v5.9.0 起停发，5.8 线最后一版为 5.8.9，
    # 且 `5.8` 浮动 tag 实测停更在 5.8.6。证据见设计 §3.1 F1–F4 与 H4。
    image: ${EMQX_IMAGE:?请在 /opt/emqx/.env 设置 EMQX_IMAGE}
    container_name: ypbin-emqx
    # ⚠️ 带点的 FQDN：v5.8 官方只说 "stable identifier, such as a hostname or FQDN"（宽松），
    #    6.x 官方明确「Erlang long-name 模式 ⇒ 不能用无点的短主机名」。按**严格口径**取（F6/F6b、H12）。
    #    hostname 必须与节点名 `@` 之后一致。
    hostname: ypbin-emqx.local

    environment:
      EMQX_NODE_NAME: ${EMQX_NODE_NAME:?}
      # Erlang 分发 cookie：官方默认值是公开的 `emqxsecretcookie`，必须覆盖。
      # 只从 .env（600）注入，不入库、不打印。
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?}
      # 首次启动即设非默认口令（官方默认 admin/public，且首登强制改密 → H2）。
      # 键名来自官方镜像 README（映射 dashboard.default_password）。
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?}
      # REST API Key 预置：官方 `api_key.bootstrap_file`（格式 `api_key:api_secret[:role]`，
      # 缺 role 时隐式 administrator）。OSS 5.8.9 是否生效由部署自检实测（设计 U18）。
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/etc/default_api_key.conf
      # 日志：只走容器 stdout（console handler），由下面的 docker logging 选项封顶；
      # 不写宿主文件卷，避免磁盘无界增长（该机 `/` 余量 ~9.5GB）。
      EMQX_DEFAULT_LOG_HANDLER: console

    ports:
      # Dashboard **与 REST API 同端口**。18083 已按用户要求改用 18093；
      # 宿主侧**只绑回环**（官方安全清单要求 Dashboard 只挂可信网络）。隧道由生产机 SSH 反向连入 127.0.0.1:18093。
      # ⚠️ 别指望 ufw/INPUT 保护它：本机 **Docker 发布端口不经 INPUT**（详见下方 1883 的说明与
      #    docs/EMQX-DEPLOY.md §3.1）⇒ 管理面的安全**完全**依赖这里的绑定地址（默认即回环）。
      - "${EMQX_DASHBOARD_BIND_ADDR:-127.0.0.1}:${EMQX_DASHBOARD_PORT:-18093}:18093"
      # ─────────────────────────────────────────────────────────────────────────
      # 1883：**开发测试期对外暴露**（2026-09-27 用户决策：「可以对外暴露没关系，反正现在是开发测试阶段」）。
      #
      # · 用**独立变量** `EMQX_MQTT_BIND_ADDR`（与上面的 Dashboard 变量分开，互不影响）；
      # · ⚠️ **不要把 18093 一起放开**：管理面必须继续只绑回环 —— 「只开数据面、不开管理面」的硬边界。
      # · 🔴🔴 **这个绑定地址就是 1883 对外可达的闸门**（本机实测）：1883 是 compose `ports:` 发布的，
      #   外部流量在 `nat/PREROUTING -j DOCKER` 被 DNAT、在 `filter/FORWARD -j DOCKER` 被 ACCEPT，
      #   **根本不经过 INPUT** ⇒ **删宿主 INPUT 规则对可达性没有任何影响**（实测证伪）。
      #   真闸门 = ① 这个绑定地址 + ② 云安全组；要按来源收敛请写 `DOCKER-USER` 或云安全组。
      # · 默认值**刻意是 127.0.0.1（fail-closed）**：`.env` 丢失/该键缺省时**绝不静默对外**，
      #   而是"没开"（宁可连不上，也不要裸奔）。开发测试期的暴露是**显式的部署期选择**：
      #       /opt/emqx/.env 里写 `EMQX_MQTT_BIND_ADDR=0.0.0.0` 再 `docker compose up -d emqx`
      #   当前中间件机即此状态。
      # · 前提与代价（详见 docs/EMQX-DEPLOY.md §3.1）：强制鉴权（内置库 + 43 字符 base64url 一次性口令）
      #   + ACL 默认拒绝（`no_match=deny`）是**开放的前提**而非可选项；而 1883 是**明文** MQTT
      #   ⇒ 设备口令与数据经公网传输，**仅开发测试期**可接受。
      # · 回滚：**必须**把本变量改回 `127.0.0.1` 并重建容器（`emqx-mqtt-expose.sh close` 只删那条
      #   纵深防御的 INPUT 规则，**不足以**收回端口）；生产前必须收回或改 TLS 8883 + 限来源 + 限流。
      # ─────────────────────────────────────────────────────────────────────────
      - "${EMQX_MQTT_BIND_ADDR:-127.0.0.1}:1883:1883"
      # ─────────────────────────────────────────────────────────────────────────
      # 8883：**MQTT over TLS**（2026-09-30 启用；看板 #9 的第一步）。
      #
      # · 与 1883 **并存**（两个 listener 各自独立，容器内分别监听 1883/8883）——
      #   本批**不**收回 1883（收回需用户在云安全组操作，属下一步）。
      # · 与 1883 **同口径**：默认 `127.0.0.1`（fail-closed），.env 丢失时绝不静默对外；
      #   开发测试期对外由 `/opt/emqx/.env` 的 `EMQX_MQTT_TLS_BIND_ADDR=0.0.0.0` **显式**打开。
      # · 容器内的开关是 `emqx.conf` 的 `listeners.ssl.default.enable`（**那一层才是真开关**；
      #   只改这里不发布 = 端口不进 DNAT，外部连不上）。
      # · 🔴 真闸门仍是「绑定地址 + 云安全组」（Docker 发布端口不经 INPUT/ufw，见 §3.1）。
      #   ⚠️ **云安全组当前未放行 8883**（从生产机实测 CLOSED）⇒ 外部设备要经公网连 8883，
      #   **必须先在云控制台放行 tcp/8883**，否则连不上。详见 docs/EMQX-DEPLOY.md §3.2。
      # · 证书：/opt/emqx/certs（自签 CA + 服务端证书，SAN 含 43.242.200.8/ypbin-emqx.local/localhost）。
      #   ⚠️ **自签证书仅开发测试期可用**，生产必须换正式 CA 证书（替换步骤见 §3.2）。
      #   证书目录以**只读**方式挂载，私钥 600、目录 700，容器内 uid 1000(emqx) 所属。
      # · 回滚一行：`EMQX_MQTT_TLS_BIND_ADDR=127.0.0.1` + `listeners.ssl.default.enable=false`
      #   再 `docker compose up -d emqx`（等价物：`bash /opt/emqx/emqx-tls-rollback.sh`）。
      # ─────────────────────────────────────────────────────────────────────────
      - "${EMQX_MQTT_TLS_BIND_ADDR:-127.0.0.1}:8883:8883"
      # 8083 / 8084（WS/WSS）/ 4370 / 5370（Erlang distribution）**一律不发布**。

    volumes:
      # 持久化（官方要求持久化 data 与 log）
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      # ACL / 认证 / client_attrs / 监听 / 限量：唯一真源（新增文件，随仓走，便于审计与评审）
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      # API Key 预置文件（**启动前由 .env 生成，600，gitignore，不得入库**）
      - ./api-key/default_api_key.conf:/opt/emqx/etc/default_api_key.conf:ro
      # TLS 证书目录（自签 CA + 服务端证书 + 私钥）。**只读挂载**，宿主侧 700/600。
      # ⚠️ 私钥**不得入库**（见 deploy/emqx/.gitignore）；生产换正式 CA 证书时只替换宿主侧文件。
      - ./certs:/opt/emqx/etc/certs-ypbin:ro

    # 🔴 必须设上限，避免将来与别人抢内存。该机 15991MB/available ~14GB（2026-09-27 实测），
    #    给 2g 的理由：① 单节点 + 目标规模 ≤500 连接（阶段②实测）；② 设计 §8.3 的 512m 是
    #    针对**生产机** available≈904MB 的工程建议，本机不适用；③ 留出充足余量给别人的项目，
    #    即使 EMQX 失控也只吃掉 2g。上限不是「推荐值」——官方未给出最低/推荐内存（F8/U2）。
    mem_limit: ${EMQX_MEM_LIMIT:-2g}
    # 宿主 swap=0（实测），显式声明不可 swap，避免行为随宿主变化而漂移。
    memswap_limit: ${EMQX_MEM_LIMIT:-2g}

    # 日志封顶（json-file 默认无上限 ⇒ 磁盘风险）
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # 官方 compose 示例用的就是这条（F7）
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

    restart: unless-stopped

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    networks:
      - emqx-edge

networks:
  emqx-edge:
    name: emqx-edge
    driver: bridge
    ipam:
      config:
        # 与既有网段无重叠：172.17(.0/16) / 172.19(baota) / 172.22(app) / 172.23(middleware)
        - subnet: 172.28.0.0/16

volumes:
  emqx-data:
    name: emqx-data
  emqx-log:
    name: emqx-log
