# =============================================================================
# EMQX 5.8.9 实验配置 —— 双节点集群 + 收紧（来源限制 / 限流）验证
# =============================================================================
# 用途：issue #218（收紧：来源限制/限流）与 #219（集群化）的**可复现实验床**。
# 与生产 /opt/emqx/emqx.conf 完全隔离（独立 compose 项目/网络/卷/端口）。
#
# ⚠️ 键名以**本版本 5.8.9 实测/源码**为准，勿照抄 6.x 文档：
#   · 5.8.9 的 listener schema **只认** max_conn_rate（无 max_conn_burst/messages_rate/
#     bytes_rate/subscribes_* 等 6.x listener 键；实测 unknown_fields 报错）。
#   · 5.8.9 的限流真源是 **limiter { max_conn_rate, messages_rate, bytes_rate }**
#     （源码 apps/emqx/src/emqx_limiter/src/emqx_limiter_schema.erl 的 short_paths/0
#      = [max_conn_rate, messages_rate, bytes_rate]，tag v5.8.9）。
#   · access_rules 是 HOCON 数组，**元素之间必须有逗号**（仅换行会把相邻字符串粘成一个，
#     实测报 invalid_rule "allow 127.0.0.1/32deny all"）。
# 作用：
#   default(1883)   允许 172.29.0.0/16 + 回环 —— "允许来源可连"
#   restricted(1884) 只允许回环            —— "不允许来源被拒"
#   ratelimited(1885) max_conn_rate=1/s    —— "限流生效"
#   limiter.messages_rate=2/s              —— 全局消息速率，触发 socket_receive_paused_by_rate_limit
# =============================================================================

node {
  name = "emqx@emqx-lab-1.local"
  data_dir = "data"
}

cluster {
  name = emqx-lab
  discovery_strategy = static
  static {
    seeds = ["emqx@emqx-lab-1.local", "emqx@emqx-lab-2.local"]
  }
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

limiter {
  max_conn_rate = "100/s"
  messages_rate = "2/s"
  bytes_rate = "1MB/s"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
  enable_authn = false
  max_conn_rate = "100/s"
  access_rules = [
    "allow 172.29.0.0/16",
    "allow 127.0.0.1/32",
    "deny all"
  ]
}

listeners.tcp.restricted {
  bind = "0.0.0.0:1884"
  enable_authn = false
  access_rules = [
    "allow 127.0.0.1/32",
    "deny all"
  ]
}

listeners.tcp.ratelimited {
  bind = "0.0.0.0:1885"
  enable_authn = false
  max_conn_rate = "1/s"
  access_rules = [
    "allow 172.29.0.0/16",
    "allow 127.0.0.1/32",
    "deny all"
  ]
}

# TLS 自签演练（issue #218）：证书由 lab/gen-lab-certs.sh 生成，只读挂载到容器。
listeners.ssl.default {
  enable = true
  bind = "0.0.0.0:8883"
  max_connections = 10000
  enable_authn = false
  max_conn_rate = "100/s"
  access_rules = [
    "allow 172.29.0.0/16",
    "allow 127.0.0.1/32",
    "deny all"
  ]
  ssl_options {
    certfile = "/opt/emqx/etc/certs-lab/server.crt"
    keyfile = "/opt/emqx/etc/certs-lab/server.key"
    cacertfile = "/opt/emqx/etc/certs-lab/ca.crt"
    verify = verify_none
    fail_if_no_peer_cert = false
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}
listeners.ws.default {
  enable = false
}
listeners.wss.default {
  enable = false
}

log {
  console {
    level = warning
  }
}
