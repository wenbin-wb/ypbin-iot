# =============================================================================
# EMQX 5.8.9 只读配置 —— ypbin IoT 接入中间件（中间件机 43.242.200.8 /opt/emqx）
# =============================================================================
# 挂载到容器内 /opt/emqx/etc/emqx.conf（只读）。
#
# 配置优先级（官方镜像自带的 emqx.conf 头部原文）：
#   etc/base.hocon < cluster.hocon < **etc/emqx.conf（本文件）** < 环境变量
# ⇒ 本文件是 ACL / 认证 / 监听 / 限量的**唯一真源**；
#   仅口令类值（Dashboard 默认口令、Erlang cookie、API Key）走环境变量（.env，600）。
#
# 设计依据：ypbin-iot/docs/EMQX-INGRESS-DESIGN.md §5.2（ACL）、§8.1（compose）、§8.2（暴露面）、H1/H2/H12
# =============================================================================

node {
  # 带点的 FQDN：官方 v5.8 只说「stable identifier, such as a hostname or FQDN」，
  # 但 6.x 明确 Erlang long-name 模式不能用无点短主机名；本设计按**严格口径**取（F6/F6b、H12）。
  # 值也会被环境变量 EMQX_NODE_NAME 覆盖（compose 里显式传入），此处保留同值便于审计。
  name = "emqx@ypbin-emqx.local"
  # data_dir 用容器内相对路径（官方默认）
  data_dir = "data"
  # ⚠️ cookie **不写在这里**：官方默认 `emqxsecretcookie` 是公开值，必须覆盖；
  #    由环境变量 EMQX_NODE__COOKIE 从 /opt/emqx/.env（600）注入，不入库、不打印。
}

cluster {
  name = ypbin-emqx
  discovery_strategy = manual
}

# -----------------------------------------------------------------------------
# Dashboard + REST API（同端口）
# -----------------------------------------------------------------------------
dashboard {
  listeners.http {
    # 宿主侧由 compose 只绑 127.0.0.1:18093（18083 在本机已被占用）。
    # 容器内必须监听 0.0.0.0，否则 docker 端口映射（从网桥网关发起）连不上。
    bind = 18093
  }
  # 默认口令由 EMQX_DASHBOARD__DEFAULT_PASSWORD 环境变量注入（H2），此处不写。
}

# -----------------------------------------------------------------------------
# MQTT 监听器
# -----------------------------------------------------------------------------
listeners.tcp.default {
  # 容器内监听 0.0.0.0；**宿主侧只发布 127.0.0.1:1883**（见 compose ports）。
  # 真设备接入的对外暴露属后续独立决策（H3：无 TLS 不得裸暴露公网）。
  bind = "0.0.0.0:1883"
  max_connections = 10240
}

# 只开必要端口（设计 §8.2）：TLS/WS/WSS 本轮「不发布」，且**在容器内也显式关停**——
# 少一组 acceptor/连接进程，也避免同网桥内其他容器误达未审计的明文/无 TLS 端口。
# 8883/8083/8084 属 P1（TLS 与浏览器直连）范围，启用时同时要改 compose 的 ports 与本节。
listeners.ssl.default {
  enable = false
}
listeners.ws.default {
  enable = false
}
listeners.wss.default {
  enable = false
}

mqtt {
  # 设备账号 username = `{tenantId}.{deviceId}`（两段数字，由平台签发端硬校验 ^[0-9]+\.[0-9]+$）。
  # 这两条表达式把两段抽成 client_attrs，供 ACL 主题模板使用（设计 §5.2 / F20）。
  # ⚠️ 服务账号（如 svc-ingress，无点）走进第 2 条会索引越界 —— 官方 `nth` 文档载明越界会让
  #    **本次 SQL 执行失败并计数**（U19）。因此服务账号**只命中 rules/users 的 username 规则**，
  #    不依赖设备模板展开；该假设由部署自检的负向用例验证。
  client_attrs_init = [
    { expression = "nth(1, tokens(username, '.'))", set_as_attr = "tenant" }
    { expression = "nth(2, tokens(username, '.'))", set_as_attr = "device" }
  ]
  # 内存上限：离线会话队列长度（默认 1000）。显式写出，避免默认值随版本漂移。
  max_mqueue_len = 1000
  # 非 MQTT 5.0 客户端的会话过期时间（默认 2h）；显式写出。
  session_expiry_interval = 2h
}

# -----------------------------------------------------------------------------
# 认证：内置数据库（Mnesia），sha256 + 盐后缀
# -----------------------------------------------------------------------------
# ⚠️ **不使用 bootstrap_file 导入设备账号**：官方 `bootstrap_file` 只在创建认证器时读一次、
#    `override=false`、读文件出错只告警不致失败 ⇒ 不适合做账号治理（F12）；且自由导入 CSV 会
#    绕过签发端 `^[0-9]+\.[0-9]+$` 的注入防护（设计 §5.4 第 2 点）。
#    设备账号一律由平台经 REST 创建（下一阶段），本阶段仅建测试账号做自检。
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
    enable = true
  }
]

# -----------------------------------------------------------------------------
# 授权（ACL）—— 红线 H1
# -----------------------------------------------------------------------------
authorization {
  # 🔴 官方默认是 `allow`（F15）：不显式设置等于「ACL 没配对时全放行」。
  no_match = deny
  # 未授权动作静默忽略（不主动断开连接）。可观测性靠 EMQX 侧 auth_error 指标增长来证明「真的拒绝了」。
  deny_action = ignore

  sources = [
    {
      type = built_in_database
      enable = true
      # 默认 100；本轮规则数 < 10，预留余量（F18）
      max_rules = 1000
    }
  ]
  # 规则本体（设备模板 + 服务账号通配）不在 HOCON 里：官方口径是经 Dashboard/HTTP API 添加，
  # 由 deploy/emqx/emqx-init.sh 幂等创建并读回校验。
}

# -----------------------------------------------------------------------------
# 保留消息（retained）：仅 `up/state` 使用（设计 §5.1 第 4 点）
# -----------------------------------------------------------------------------
retainer {
  enable = true
  # 保留消息的过期时间与单条大小上限（默认 msg_expiry_interval=5s 对「最后一次状态」太短）
  msg_expiry_interval = 1h
  max_payload_size = 1MB
  backend {
    type = built_in_database
    storage_type = ram
    # 官方默认 0 = **无限**（见镜像自带 examples/retainer.conf.example）；
    # 本机磁盘余量有限 ⇒ 封顶 1000 条，避免主题基数无界增长拖垮内存/磁盘。
    max_retained_messages = 1000
  }
}

# -----------------------------------------------------------------------------
# 日志：走容器 stdout（EMQX_DEFAULT_LOG_HANDLER=console），由 compose 的 logging 选项封顶。
# 这里仍显式写出 file 句柄的滚动参数：一旦有人把 handler 切成 file，也不会无界增长。
# 键名取自镜像自带的 etc/base.hocon 与 etc/examples/log.file.conf.example（一手）。
# ⚠️ 实测记录：曾误写 `log.audit { … }` —— 5.8.9 的 log schema **无 audit 字段**，
#    容器会 `failed_to_check_schema: unknown_fields path=log unknown=audit` 并崩溃重启（已改正）。
# -----------------------------------------------------------------------------
log {
  console {
    level = warning
  }
  file {
    level = warning
    rotation_size = 20MB
    rotation_count = 5
  }
}
