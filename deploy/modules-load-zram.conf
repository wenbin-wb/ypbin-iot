# zram 压缩 swap 的成对持久化 —— 内核模块半边
#
# 由 systemd-modules-load.service 在开机早期（sysinit）加载，使 zram-swap.service 的
# `After=systemd-modules-load.service` 真正有意义：模块先就绪 → 再建 /dev/zram0。
# （zram-swap-up.sh 内仍有 `modprobe zram` 兜底，两者不冲突。）
#
# 安装位置：/etc/modules-load.d/zram.conf
# 回滚    ：systemctl disable --now zram-swap.service && rm -f /etc/sysctl.d/99-zram-swap.conf \
#             /etc/modules-load.d/zram.conf && sysctl -w vm.swappiness=60
zram
