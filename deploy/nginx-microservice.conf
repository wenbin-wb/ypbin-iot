# 生产前端 nginx 配置：静态托管 + /api/ 反代网关。
# 由 deploy/docker-compose.yml 挂给 ypbin-iot-ui（同一份文件也挂给 ypbin-admin-ui），
# 改这里会同时影响两个前端，改动前确认对管理台同样安全。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- 安全响应头（always：错误响应也带）----
    # ⚠️ nginx 的 add_header 不会跨层合并：某个 location 只要自己写了 add_header，
    #    就**不再继承** server 级的 add_header ⇒ 下面「静态资源」「index.html」两处必须重复这 3 个头。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 压缩 ----
    # nginx 的 gzip 默认是 off（官方镜像的 nginx.conf 里也是注释态），不显式打开则首屏 JS/CSS/JSON 不压缩。
    # gzip_types 刻意不包含 text/event-stream：SSE 不能压缩（压缩会攒缓冲，实时事件看起来「延迟/不动」）。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    location ~ ^/(\.git|\.env|\.svn|\.user\.ini|\.htaccess) {
        return 404;
    }

    # 数字孪生模型上传：单文件上限 64MB（与 iot 侧 TwinLimits.MAX_MODEL_BYTES、
    # ypbin.storage.max-file-size、Spring multipart.max-file-size 四处同值）。
    #
    # ⚠️ 为什么用 `location = ` 精确匹配而不是正则 `location ~ `：
    #   nginx 硬规则——正则 location（以及 named / if / limit_except 块）里的
    #   `proxy_pass` **不允许带 URI 部分**，写成 `proxy_pass http://up/;` 会直接
    #   `nginx -t` emerg 报错「proxy_pass cannot have URI part in location given by
    #   regular expression」，整个前端容器起不来（本机用 nginx:alpine 实测复现）。
    #   而本处**必须**带 URI 来剥掉 `/api` 前缀（与下面 /api/ 的 `proxy_pass .../` 等价），
    #   所以只能用前缀/精确匹配形态。
    #
    # ⚠️ 顺序说明（避免误以为是「最长匹配优先」）：nginx 的正则 location 按**配置出现顺序**
    #   匹配（首个即用），前缀 location 则是**最长前缀优先**。本块是精确匹配（优先级最高），
    #   放在 /api/ 前后都可以；这里放在前面是为了让「上传专用限制」在视野上紧邻 /api/ 段。
    #
    # 实测（本机 nginx:alpine + 回显上游 $request_uri）：
    #   POST /api/iot/twin/model-assets/upload（5MB）→ 上游收到 /iot/twin/model-assets/upload，HTTP 200
    #   POST /api/iot/devices（5MB）→ HTTP 413（3m 限制仍生效，未误放开）
    location = /api/iot/twin/model-assets/upload {
        client_max_body_size 64m;
        proxy_pass http://ypbin-gateway:18080/iot/twin/model-assets/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传可能超过默认 60s 读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前端生产环境 VITE_GLOB_API_URL=/api，去掉 /api 前缀后转发给微服务网关
    location /api/ {
        # 设备导入文件上限是 2MB（前端 DEVICE_IMPORT_FRONTEND_LIMITS 与后端 DeviceImportLimits 同值），
        # 而 nginx 的 client_max_body_size 默认只有 1m ⇒ 1–2MB 的 CSV 会在这一层被 413 拒掉，
        # 前端只能显示「网络/未知错误」，用户拿不到后端「逐行失败」的结论。
        # 3m = 2MB 数据 + multipart 边界/表单开销余量。
        client_max_body_size 3m;
        proxy_pass http://ypbin-gateway:18080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 实时流必须关闭缓冲：否则 nginx 会攒满缓冲才下发，事件看起来「延迟/不动」。
        # 心跳 15s 一条，300s 读超时足够；前端断线会自动重连。
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 本 location 有自己的 add_header ⇒ 必须重复 server 级的 3 个安全头（见文件上方说明）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # 同上：本 location 自己的 add_header 会屏蔽 server 级安全头，必须重复
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
