# ypbin-admin 微服务版本地部署环境
#
# 用法：
#   docker compose -f docker-compose.yml up -d
#
# 说明：本文件编排基础设施（Nacos/Redis/MySQL/IoTDB 时序库）+ 微服务四件套 + 网关 + XXL-JOB 调度中心，
# 单文件即可拉起全链路。账号密码一律从 .env 注入。
# 时序库（IoTDB）的契约、初始化与排障另见 docs/DEPLOY-TIMESERIES.md。
#
# 网络：所有服务接入自定义网络 ypbin-net（固定 subnet + 固定 IP），
# 容器重建不漂移 IP —— 避免 nginx 等"启动时解析一次"的代理因上游 IP 变化 502。
# 服务间仍优先用服务名（Docker DNS）通信；固定 IP 作为 DNS 解析的稳定兜底。

services:
  # ---------- 基础设施 ----------
  nacos:
    image: ${REGISTRY_PREFIX:-}nacos/nacos-server:v3.2.4
    container_name: ypbin-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # Nacos 鉴权凭据一律来自 deploy/.env（install.sh 自动生成随机值，禁止硬编码入库；
      # NACOS_AUTH_TOKEN 需为 Base64 且解码后 ≥32 字节，缺失时 compose 直接报错）
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请在deploy/.env设置NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请在deploy/.env设置NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请在deploy/.env设置NACOS_AUTH_IDENTITY_VALUE}
      # 服务端鉴权开关（2026-09-26 起为 true，此前为 false）：
      #   镜像内 bin/docker-startup.sh:96-98 只在 NACOS_AUTH_ENABLE 非空时追加
      #   `-Dnacos.core.auth.enabled=${NACOS_AUTH_ENABLE}`（JVM 系统属性优先于 application.properties 里
      #   硬编码的 `nacos.core.auth.enabled=false`）⇒ 这是本镜像**唯一**的开 auth 入口（一手核实：容器内脚本原文）。
      #   `console.enabled`/`admin.enabled` 在镜像 properties 里已是 true，无需另设。
      # ⚠️ 开 auth 后 **client 侧（8848）** 也要求身份：所有连 Nacos 的服务必须带
      #   `spring.cloud.nacos.username/password`（见各服务 environment 的 SPRING_CLOUD_NACOS_*），
      #   否则注册失败 ⇒ 网关全体 503。开关与回滚见 docs/NACOS-AUTH.md。
      NACOS_AUTH_ENABLE: "true"
    ports:
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:8848:8848"
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:9848:9848"
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:8080:8080"
    volumes:
      - ypbin-nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.10

  redis:
    image: ${REGISTRY_PREFIX:-}redis:7-alpine
    container_name: ypbin-redis
    # requirepass 由**受管 600 文件**（deploy/redis-requirepass.conf，deploy/redis-auth-conf.sh 从 .env 生成、
    # owner/gid 对齐镜像内 redis 用户 999:1000）承载，不再写 `--requirepass <口令>`：
    #   ① `--requirepass <值>` 会把明文口令留在容器 argv ⇒ `docker top`/宿主 `ps`/`docker events`
    #      直接可读（2026-09-26 实测），与上一轮 IoTDB 健康检查同类；
    #   ② 仍以 `redis-server` 作首个参数 ⇒ **保留官方 entrypoint 的 `$1 = redis-server` 分支**
    #      （chown /data + setpriv 降权到 redis 用户），运行身份与数据卷语义不变；
    #   ③ 首次 `up` 前该文件必须存在（缺失时 docker 会把 bind 源建成目录 ⇒ redis 启动失败）：
    #      install.sh 已内建生成步骤，手工部署见 docs/DEPLOY-CREDENTIAL-HYGIENE.md §2。
    command: ["redis-server", "/usr/local/etc/redis/redis-requirepass.conf", "--appendonly", "yes"]
    # 仅绑定本机回环：容器间经 compose 网络互访，无需对宿主机全网卡暴露
    ports:
      - "${INTERNAL_BIND_ADDR:-127.0.0.1}:6379:6379"
    volumes:
      - ypbin-redis-data:/data
      - ./redis-requirepass.conf:/usr/local/etc/redis/redis-requirepass.conf:ro
    healthcheck:
      # **不带凭据**的存活探活（TCP 连通性，与 IoTDB 同一口径）：只证明 6379 可连、不校验口令。
      # 为什么不是带 `-a <口令>` 的 `redis-cli ping`：那条每 10s 把明文口令写进 argv（`docker top` 与
      #   `docker events` 的 exec 属性都能抓到）；而 `redis-cli ping` 不带口令时对 NOAUTH 也 exit 0
      #   （实测：NOAUTH 仍 0、端口关闭才 1）⇒ 它反而不比 TCP 更能证明「认证可用」，却要付出明文代价。
      # 为什么不是 `redis-cli --no-auth-warning`/`REDISCLI_AUTH`：见 docs/DEPLOY-CREDENTIAL-HYGIENE.md §3
      #   （前者的 `-a` 仍进 argv；后者要求把口令再注入容器 env，换来的是可替代的探活强度）。
      # 折衷（明确记账）：口令正确性不在本探针校验，改由应用侧（auth/system 连 Redis 失败即报错、
      #   登录链路 500）承担——本仓 Redis 侧**没有** IoTDB 那样的专用指标，如实登记为较弱口径。
      test: ["CMD-SHELL", "timeout 3 nc -z 127.0.0.1 6379"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.11

  mysql:
    image: ${REGISTRY_PREFIX:-}mysql:8.4
    container_name: ypbin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ypbin_admin
      TZ: Asia/Shanghai
    ports:
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:3306:3306"
    volumes:
      - ypbin-mysql-data:/var/lib/mysql
    healthcheck:
      # **不带凭据**的存活探活（2026-09-26 起）：`mysqladmin ping` 只要服务端应答就 exit 0 ——
      #   实测（mysql:8.4 容器内）：无口令/错口令 ⇒ `Access denied … (using password: NO/YES)` 且 **exit 0**；
      #   端口关闭 ⇒ `Can't connect … (111)` 且 **exit 1**。口径与 IoTDB/Redis 一致：只证「服务端活着应答」。
      # 为什么不是 `-p<口令>`：那条每 10s 把明文 root 口令写进 argv（`docker top`/宿主 `ps`/`docker events`
      #   的 exec 属性可读）。口令正确性改由应用侧承担（服务连库失败即报错、健康降级），折衷见
      #   docs/DEPLOY-CREDENTIAL-HYGIENE.md §3。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.12

  # ---------- 时序库（Apache IoTDB 表模型）----------
  # 契约/DDL/运维见 docs/DEPLOY-TIMESERIES.md，设计见 docs/IOT-PLATFORM-DESIGN.md §5.2.1。
  # image tag 已核实存在：apache/iotdb:2.0.11-standalone（Docker Hub 官方 apache 命名空间，
  # `docker manifest inspect` 实测可解析，2026-09-24）。
  # ⚠️ 平台侧驱动是 org.apache.iotdb:iotdb-jdbc:2.0.1-beta（ypbin-service/ypbin-iot/pom.xml，runtime scope），
  #    官方约束「不要用更新的客户端连更旧的服务端」⇒ 服务端 >= 客户端是安全方向（当前 2.0.11 > 2.0.1-beta）；
  #    若要严格同版本，可改镜像为 apache/iotdb:2.0.1-beta-standalone（该 tag 同样已核实存在）。
  iotdb:
    image: ${REGISTRY_PREFIX:-}apache/iotdb:2.0.11-standalone
    container_name: ypbin-iotdb
    # 与 cn_internal_address/dn_* 同名：官方 standalone compose 也是这么设的（hostname 与内部地址一致），
    # 避免只靠 Docker DNS 解析容器名的隐式行为
    hostname: ypbin-iotdb
    environment:
      # 这些**全小写**变量由镜像 entrypoint 写入 iotdb-system.properties
      # （官方 Dockerfile-1.0.0-standalone → entrypoint.sh → replace-conf-from-env.sh：把环境里
      #   「键名全小写」的变量逐个替换进 conf，2026-09-24 核实源码）。
      # 地址必须与容器名一致：ypbin-iot 通过 jdbc:iotdb://ypbin-iotdb:6667/iot?sql_dialect=table 连接。
      cn_internal_address: ypbin-iotdb
      cn_internal_port: "10710"
      cn_consensus_port: "10720"
      cn_seed_config_node: ypbin-iotdb:10710
      dn_rpc_address: ypbin-iotdb
      dn_internal_address: ypbin-iotdb
      dn_rpc_port: "6667"
      dn_mpp_data_exchange_port: "10740"
      dn_schema_region_consensus_port: "10750"
      dn_data_region_consensus_port: "10760"
      dn_seed_config_node: ypbin-iotdb:10710
    ports:
      # 6667 是客户端 RPC 口；IoTDB 官方**默认口令是公开的 root/root**（官方 Authority Management），
      # 生产已轮换（见 docs/DEPLOY-TIMESERIES.md §6），但本端口仍不得对外：口令只是第二道锁。
      # ⚠️ 这里用**独立**变量 IOTDB_BIND_ADDR（而不是共用的 INTERNAL_BIND_ADDR）：本仓 .env.example 把
      # INTERNAL_BIND_ADDR 设成 0.0.0.0，共用会把 6667 暴露到全网；独立变量的默认值是回环，
      # 即"不显式设置就只允许宿主机内访问"（要用外部客户端接入时再设 IOTDB_BIND_ADDR）。
      - "${IOTDB_BIND_ADDR:-127.0.0.1}:6667:6667"
    volumes:
      - ypbin-iotdb-data:/iotdb/data
      - ypbin-iotdb-logs:/iotdb/logs
    healthcheck:
      # 官方**没有**为 Docker 部署提供健康检查端点或探针命令（官方自带 health_check.sh 是「部署环境体检」：
      # 查 JDK/内存/目录权限/端口占用/ulimit/swap，不是就绪探针）。
      # 6667 是 Thrift RPC 口，HTTP 探针没有意义 ⇒ 用 TCP 连通性探活。
      #
      # ⚠️ 2026-09-26 起改为**不发口令的 TCP 探活**，取代此前的
      #    `start-cli.sh -h ypbin-iotdb -u root -pw <口令> -sql_dialect table -e "SHOW DATABASES"`：
      #    那条探针每 30s 把**明文口令**放进进程 argv（实测 `docker top ypbin-iotdb` 可抓到
      #    `… org.apache.iotdb.cli.Cli -h ypbin-iotdb -p 6667 -u root -pw <口令> -sql_dialect table -e SHOW DATABASES`，
      #    `docker inspect .Config.Healthcheck.Test` 里也是明文）⇒ 等同于口令持续暴露。
      # 为什么不是「换个方式传口令」：容器内 /iotdb/sbin/start-cli.sh 只认命令行 `-pw <值>`，
      #    其 checkEnvVariables 只识别 IOTDB_INCLUDE / IOTDB_CLI_CONF 两个 `-D` 变量，
      #    **没有**口令相关的环境变量或配置文件入口（一手核实：镜像内脚本原文，2026-09-26）
      #    ⇒ 「配置文件 / 环境变量」两条路都不通，故取「不发口令的 TCP 探活」。
      # 折衷（明确记账）：本探针只证明「6667 可连」，**不校验凭据**。凭据维度的低频业务探针由应用侧
      #    承担：ypbin-iot 的 `iot.timeseries.db.rows`（SELECT COUNT(*) 真值对账，默认 10 分钟一次）
      #    与 `iot.timeseries.db.probe.failed`（对账失败计数）——口令错/库不可用会直接表现为后者增长
      #    （见 docs/DEPLOY-TIMESERIES.md §6）。
      # 为什么是 bash 的 /dev/tcp：镜像内没有 nc；bash 与 timeout 实测存在（/usr/bin/bash、/usr/bin/timeout），
      #    /dev/tcp 是 bash 内建，不依赖额外二进制。本机实测（2026-09-26）：
      #    `timeout 5 bash -c '</dev/tcp/ypbin-iotdb/6667'` ⇒ exit 0；换成关闭端口 ⇒ exit 1。
      # ⚠️ 必须连 `ypbin-iotdb` 而**不是** 127.0.0.1：`dn_rpc_address` 是**绑定地址**（IoTDBConfig 默认
      #    127.0.0.1），设成 `ypbin-iotdb` 后服务端只绑容器 eth0，loopback 无监听 ⇒ 用 127.0.0.1 探活会
      #    **永远 unhealthy**（本机实测复现：同一容器 `<hostname>` exit 0、`127.0.0.1` exit 1）。
      # 该探针只用于 `docker compose ps` 观测，**不用它驱动别的服务启动顺序**（见 iotdb-init 的自重试）。
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/ypbin-iotdb/6667' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.13

  # 一次性初始化：建库 iot + 建表 iot.reading（DDL 本体在 deploy/iotdb-init.sql，本处只做执行器）
  # 为什么放 compose 而不是 install.sh：install.sh 的 Nacos 占位符替换键是固定的 4 个
  # （MYSQL_ROOT_PASSWORD/REDIS_PASSWORD/INTERNAL_TOKEN/GATEWAY_SIGN_TOKEN），时序初始化与它无耦合；
  # 放这里则 `docker compose up -d` 一条命令即可复现。
  # 幂等：DDL 全用 IF NOT EXISTS，每次 up 重跑无副作用。
  iotdb-init:
    image: ${REGISTRY_PREFIX:-}apache/iotdb:2.0.11-standalone
    container_name: ypbin-iotdb-init
    depends_on:
      iotdb:
        # 刻意用 service_started + 自重试（同一镜像自带 CLI），不依赖上面的 healthcheck 语义
        condition: service_started
    entrypoint:
      - /bin/bash
      - /init/iotdb-init.sh
    # 这里**不需要** `command: []`（源码级结论）：覆盖 entrypoint 本身已使镜像的 CMD 不被继承——
    # moby `daemon/commit.go` 的 `merge` 在 `len(userConf.Entrypoint) == 0` 时才会
    # `if len(userConf.Cmd) == 0 { userConf.Cmd = imageConf.Cmd }`，即注入镜像 CMD 的完整条件是
    # 「entrypoint 与 cmd 都为空」；本服务 entrypoint 非空 ⇒ 实际进程就是 `/bin/bash /init/iotdb-init.sh`。
    # （第一版曾误以为镜像 CMD 会被当参数追加而写了 `command: []`，已按 moby 源码更正，2026-09-24。）
    environment:
      # ⚠️ 口令的**第三处**：改 IoTDB 口令时这两处必须一起改：
      #   ① IoTDB 内（ALTER USER root SET PASSWORD …）② Nacos ypbin-iot.yaml 的 ypbin.timeseries.password
      #   （③ 就是这里）——否则重跑本容器会连续 801（用户名或口令错）并最终 exit 1。
      # 真值只写在 deploy/.env（600、不入库）。
      # ⚠️ 这里**刻意不用** `${IOTDB_PASSWORD:?...}`（2026-09-26 复核指出）：compose 对整份文件做变量插值，
      #    `:?` 会让「该键缺失」升级成「同目录下任何 compose 命令都失败」（含只读的 `ps`，以及 install.sh 里
      #    更早的 `up -d nacos redis mysql`）——波及面远大于本服务，且全新安装的 .env 本来就没有这个键。
      #    缺键的 fail-fast 改由 iotdb-init.sh 自己承担（缺失即退出 1 + 明确指引，且**不**回退到公开默认口令）。
      # ⚠️ 残留暴露面（如实登记）：口令虽不进 argv，但它仍是本容器的环境变量 ⇒ `docker inspect` 的
      #    `Config.Env` 与 `/proc/<pid>/environ` 可见（仅 root/容器内可读）。这是「不落 argv」的已知代价。
      IOTDB_USER: root
      IOTDB_PASSWORD: ${IOTDB_PASSWORD:-}
    volumes:
      - ./iotdb-init.sh:/init/iotdb-init.sh:ro
      - ./iotdb-init.sql:/init/iotdb-init.sql:ro
    # 一次性任务：跑完就退出，不重启（退出码 0=成功，非 0=失败，见 docker compose ps -a）
    restart: "no"
    networks:
      # 刻意**不**给固定 ipv4_address：本仓给固定 IP 是为了「容器重建不漂移、避免代理缓存上游 IP 而 502」，
      # 而这是一次性任务、没有任何服务会缓存它的地址，占一个固定 IP 只有坏处（地址耗尽 + 语义误导）
      - ypbin-net

  # 说明：Sentinel Dashboard 由 starter 的 deploy 提供（从官方 jar 自构建，
  # 镜像 ypbin/sentinel-dashboard:1.8.8），本文件不重复编排；如需限流控制台，
  # 先执行 starter 的 docker-compose.yml 或单独构建 sentinel-dashboard。

  # ---------- 微服务 ----------
  ypbin-gateway:
    build:
      context: ../ypbin-gateway
    image: ypbin/ypbin-gateway:local
    container_name: ypbin-gateway
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      # Nacos 客户端凭据（开 auth 后必需，否则拉配置 + 注册双双失败）：环境变量到
      # `spring.cloud.nacos.username/password` 的 relaxed binding。要点：discovery 侧
      # （NacosDiscoveryProperties，@ConfigurationProperties("spring.cloud.nacos.discovery")）在
      # 自身 username/password 为空时会回退到父级 `spring.cloud.nacos.*`（一手核实：spring-cloud-alibaba
      # 2025.1.0.0 字节码常量池 `${spring.cloud.nacos.username:}`），故这两个键同时覆盖 **config 与 discovery**。
      # 真值只写在 deploy/.env（600）。用 `:?` 而非空兜底：本文件已开 auth（NACOS_AUTH_ENABLE），
      # 空口令必然导致「全部服务注册失败」这种最难排查的形态，宁可让 compose 在解析期就报缺失键。
      # （install.sh 会生成该键、.env.example 已列；旧 .env 由 env_key_backfill 补齐。）
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_ADMIN_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_ADMIN_PASSWORD:?请在deploy/.env设置NACOS_ADMIN_PASSWORD}
    ports:
      - "18080:18080"
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.20

  ypbin-auth:
    build:
      context: ../ypbin-auth
    image: ypbin/ypbin-auth:local
    container_name: ypbin-auth
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      # Nacos 客户端凭据（开 auth 后必需，否则拉配置 + 注册双双失败）：环境变量到
      # `spring.cloud.nacos.username/password` 的 relaxed binding。要点：discovery 侧
      # （NacosDiscoveryProperties，@ConfigurationProperties("spring.cloud.nacos.discovery")）在
      # 自身 username/password 为空时会回退到父级 `spring.cloud.nacos.*`（一手核实：spring-cloud-alibaba
      # 2025.1.0.0 字节码常量池 `${spring.cloud.nacos.username:}`），故这两个键同时覆盖 **config 与 discovery**。
      # 真值只写在 deploy/.env（600）。用 `:?` 而非空兜底：本文件已开 auth（NACOS_AUTH_ENABLE），
      # 空口令必然导致「全部服务注册失败」这种最难排查的形态，宁可让 compose 在解析期就报缺失键。
      # （install.sh 会生成该键、.env.example 已列；旧 .env 由 env_key_backfill 补齐。）
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_ADMIN_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_ADMIN_PASSWORD:?请在deploy/.env设置NACOS_ADMIN_PASSWORD}
    ports:
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:18081:18081"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.21

  ypbin-system:
    build:
      context: ../ypbin-service/ypbin-system
    image: ypbin/ypbin-system:local
    container_name: ypbin-system
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      # Nacos 客户端凭据（开 auth 后必需，否则拉配置 + 注册双双失败）：环境变量到
      # `spring.cloud.nacos.username/password` 的 relaxed binding。要点：discovery 侧
      # （NacosDiscoveryProperties，@ConfigurationProperties("spring.cloud.nacos.discovery")）在
      # 自身 username/password 为空时会回退到父级 `spring.cloud.nacos.*`（一手核实：spring-cloud-alibaba
      # 2025.1.0.0 字节码常量池 `${spring.cloud.nacos.username:}`），故这两个键同时覆盖 **config 与 discovery**。
      # 真值只写在 deploy/.env（600）。用 `:?` 而非空兜底：本文件已开 auth（NACOS_AUTH_ENABLE），
      # 空口令必然导致「全部服务注册失败」这种最难排查的形态，宁可让 compose 在解析期就报缺失键。
      # （install.sh 会生成该键、.env.example 已列；旧 .env 由 env_key_backfill 补齐。）
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_ADMIN_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_ADMIN_PASSWORD:?请在deploy/.env设置NACOS_ADMIN_PASSWORD}
    ports:
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:18082:18082"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.22

  ypbin-ai:
    build:
      context: ../ypbin-service/ypbin-ai
    image: ypbin/ypbin-ai:local
    container_name: ypbin-ai
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      # Nacos 客户端凭据（开 auth 后必需，否则拉配置 + 注册双双失败）：环境变量到
      # `spring.cloud.nacos.username/password` 的 relaxed binding。要点：discovery 侧
      # （NacosDiscoveryProperties，@ConfigurationProperties("spring.cloud.nacos.discovery")）在
      # 自身 username/password 为空时会回退到父级 `spring.cloud.nacos.*`（一手核实：spring-cloud-alibaba
      # 2025.1.0.0 字节码常量池 `${spring.cloud.nacos.username:}`），故这两个键同时覆盖 **config 与 discovery**。
      # 真值只写在 deploy/.env（600）。用 `:?` 而非空兜底：本文件已开 auth（NACOS_AUTH_ENABLE），
      # 空口令必然导致「全部服务注册失败」这种最难排查的形态，宁可让 compose 在解析期就报缺失键。
      # （install.sh 会生成该键、.env.example 已列；旧 .env 由 env_key_backfill 补齐。）
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_ADMIN_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_ADMIN_PASSWORD:?请在deploy/.env设置NACOS_ADMIN_PASSWORD}
      AI_MODEL_SECRET_KEY: ${AI_MODEL_SECRET_KEY:?请在 deploy/.env 设置 AI_MODEL_SECRET_KEY（16/24/32 字节）}
    ports:
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:18083:18083"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.23

  # ---------- IoT 业务服务（第 3 个业务域；接入单元 access 后续单独加）----------
  # ---------- IoT 设备接入单元（有状态、独立部署；不连库，租约来自 ypbin-iot）----------
  ypbin-access:
    build:
      context: ../ypbin-service/ypbin-access
    image: ypbin/ypbin-access:local
    container_name: ypbin-access
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      # Nacos 客户端凭据（开 auth 后必需，否则拉配置 + 注册双双失败）：环境变量到
      # `spring.cloud.nacos.username/password` 的 relaxed binding。要点：discovery 侧
      # （NacosDiscoveryProperties，@ConfigurationProperties("spring.cloud.nacos.discovery")）在
      # 自身 username/password 为空时会回退到父级 `spring.cloud.nacos.*`（一手核实：spring-cloud-alibaba
      # 2025.1.0.0 字节码常量池 `${spring.cloud.nacos.username:}`），故这两个键同时覆盖 **config 与 discovery**。
      # 真值只写在 deploy/.env（600）。用 `:?` 而非空兜底：本文件已开 auth（NACOS_AUTH_ENABLE），
      # 空口令必然导致「全部服务注册失败」这种最难排查的形态，宁可让 compose 在解析期就报缺失键。
      # （install.sh 会生成该键、.env.example 已列；旧 .env 由 env_key_backfill 补齐。）
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_ADMIN_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_ADMIN_PASSWORD:?请在deploy/.env设置NACOS_ADMIN_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # 每个副本必须唯一（租约归属的键）；扩容时逐副本注入不同的 ACCESS_NODE_ID
      ACCESS_NODE_ID: ${ACCESS_NODE_ID:-access-1}
    ports:
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:18086:18086"
    depends_on:
      nacos:
        condition: service_healthy
      ypbin-iot:
        condition: service_started
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.26

  ypbin-iot:
    build:
      context: ../ypbin-service/ypbin-iot
    image: ypbin/ypbin-iot:local
    container_name: ypbin-iot
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      # Nacos 客户端凭据（开 auth 后必需，否则拉配置 + 注册双双失败）：环境变量到
      # `spring.cloud.nacos.username/password` 的 relaxed binding。要点：discovery 侧
      # （NacosDiscoveryProperties，@ConfigurationProperties("spring.cloud.nacos.discovery")）在
      # 自身 username/password 为空时会回退到父级 `spring.cloud.nacos.*`（一手核实：spring-cloud-alibaba
      # 2025.1.0.0 字节码常量池 `${spring.cloud.nacos.username:}`），故这两个键同时覆盖 **config 与 discovery**。
      # 真值只写在 deploy/.env（600）。用 `:?` 而非空兜底：本文件已开 auth（NACOS_AUTH_ENABLE），
      # 空口令必然导致「全部服务注册失败」这种最难排查的形态，宁可让 compose 在解析期就报缺失键。
      # （install.sh 会生成该键、.env.example 已列；旧 .env 由 env_key_backfill 补齐。）
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_ADMIN_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_ADMIN_PASSWORD:?请在deploy/.env设置NACOS_ADMIN_PASSWORD}
    ports:
      # ⚠️ 绑定地址**刻意与 INTERNAL_BIND_ADDR 分开**（同 IoTDB 的 IOTDB_BIND_ADDR 先例，2026-09-26）。
      # 原因：18084 现在暴露 `/actuator/metrics` 与 `/actuator/health`（可观测缺口补齐，见
      # docs/DEPLOY-BACKEND.md §5），而 INTERNAL_BIND_ADDR 在本仓示例里默认 0.0.0.0 ⇒ 共用会把
      # **无认证的 Actuator 端点**直接摆到公网。默认回环 ⇒ 只在宿主机内可 curl、公网不可达；
      # 要让宿主机外的客户端访问，先确认真的需要，再显式设 IOT_BIND_ADDR=0.0.0.0 并承担该暴露面。
      - "${IOT_BIND_ADDR:-127.0.0.1}:18084:18084"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.24

  # ---------- XXL-JOB 调度中心（独立中间件，任务调度/日志 UI）----------
  xxl-job-admin:
    image: ${REGISTRY_PREFIX:-}xuxueli/xxl-job-admin:3.4.2
    container_name: ypbin-xxl-job-admin
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD} --xxl.job.accessToken= --server.port=8080"
    ports:
      - "${INTERNAL_BIND_ADDR:-0.0.0.0}:18085:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.30

  # ---------- 前端 ----------
  ypbin-admin-ui:
    image: ${REGISTRY_PREFIX:-}nginx:alpine
    container_name: ypbin-admin-ui
    volumes:
      - ${ADMIN_UI_DIST_DIR:-../admin-ui-dist}:/usr/share/nginx/html:ro
      - ./nginx-microservice.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_UI_PORT:-19000}:80"
    depends_on:
      - ypbin-gateway
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.40

  # ---------- IoT 前端（与管理台前端同一模式：nginx 静态托管 + /api 反代网关）----------
  ypbin-iot-ui:
    image: ${REGISTRY_PREFIX:-}nginx:alpine
    container_name: ypbin-iot-ui
    volumes:
      # 前端静态产物目录（由 deploy/ui-up.sh 或 CI 产出；默认 ../iot-ui-dist）
      - ${IOT_UI_DIST_DIR:-../iot-ui-dist}:/usr/share/nginx/html:ro
      # 与 admin-ui 共用同一份 nginx 配置：SPA 回退 + /api/ → ypbin-gateway:18080
      - ./nginx-microservice.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 端口口径（三处一致，详见 docs/DEPLOY-UI.md「端口口径」）：
      #   默认 19001 = 与同一 compose 项目里 admin-ui 的默认 19000 **并存**（install.sh 会全量 up -d，
      #                两个前端默认同端口必然有一个启动失败）；
      #   生产/安装时用 .env 的 IOT_UI_PORT 覆盖（本生产实例为 19000，未部署 admin-ui）。
      # 改这里时必须同步 deploy/ui-up.sh 的 IOT_UI_PORT 默认值与 docs/DEPLOY-UI.md。
      - "${IOT_UI_PORT:-19001}:80"
    depends_on:
      - ypbin-gateway
    restart: unless-stopped
    networks:
      ypbin-net:
        ipv4_address: 172.20.0.41

networks:
  ypbin-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  ypbin-redis-data:
  ypbin-mysql-data:
  ypbin-nacos-data:
  ypbin-iotdb-data:
  ypbin-iotdb-logs:
